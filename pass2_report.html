for his own consumption), and to destroy (apollymi, \\\"to destroy, ruin, lose\\\"). The verb apollymi is the same word used throughout the document for perishing (3:16, \\\"should not perish\\\"; 6:12, \\\"that nothing will be lost\\\"; 6:39, \\\"that I lose nothing\\\"). The thief's purpose is the opposite of the shepherd's: the shepherd gives life, the thief takes it. The Pharisees' treatment of the man born blind -- using him, interrogating him, expelling him -- illustrates the pattern of exploitation that \\\"steal, kill, destroy\\\" describes.\\n\\n**\\\"I came that they may have life, and have it abundantly\\\" (ego elthon hina zoen echosin kai perisson echosin).** The contrast between the thief's purpose and Jesus's purpose could not be sharper. The word perisson (\\\"abundantly, more than enough, overflowing\\\") indicates not merely survival but superabundance. This echoes the pattern of Jesus's provision throughout the document: the wine at Cana was abundant (six stone jars, twenty to thirty gallons each, 2:6-7), the bread in chapter 6 left twelve baskets of surplus (6:13), the living water will become \\\"a spring of water springing up to eternal life\\\" (4:14) and \\\"rivers of living water\\\" (7:38). The shepherd does not bring the sheep to a meager existence but to overflowing life. The \\\"life\\\" (zoe) Jesus came to give is the same life that was in the Word from the beginning (1:4), the life the Father has in himself and has granted the Son to have in himself (5:26), the eternal life that is the document's central promise (3:16, 36; 5:24; 6:40, 47, 54).\\n\\n---\\n\\n## Verses 11-18: \\\"I Am the Good Shepherd\\\"\\n\\n\\\"I am the good shepherd; the good shepherd lays down his life for the sheep. He who is a hired hand, and not a shepherd, who is not the owner of the sheep, sees the wolf coming, and leaves the sheep and flees, and the wolf snatches them and scatters them. He flees because he is a hired hand and is not concerned about the sheep. I am the good shepherd, and I know my own and my own know me, even as the Father knows me and I know the Father; and I lay down my life for the sheep. I have other sheep, which are not of this fold; I must bring them also, and they will hear my voice; and they will become one flock with one shepherd. For this reason the Father loves me, because I lay down my life so that I may take it again. No one has taken it away from me, but I lay it down on my own initiative. I have authority to lay it down, and I have authority to take it up again. This commandment I received from my Father.\\\"\\n\\n**\\\"I am the good shepherd\\\" (ego eimi ho poimen ho kalos).** The fourth \\\"I am\\\" statement with a predicate. The adjective kalos means not merely \\\"good\\\" in the sense of competent or adequate but \\\"good\\\" in the sense of noble, beautiful, excellent, ideal -- the shepherd who fulfills what a shepherd is supposed to be. The LXX uses kalos to describe what is fitting, right, and pleasing (Genesis 1:31: God saw all that he had made, and it was \\\"very good,\\\" kalon lian). The \\\"good shepherd\\\" is the true shepherd, the one who embodies the shepherd-ideal that all others have failed to meet.\\n\\nThe claim, set against the background of Ezekiel 34, is staggering. God declared: \\\"I myself will search for my sheep... I myself will be the shepherd of my sheep\\\" (Ezekiel 34:11, 15). And then: \\\"I will set up over them one shepherd, my servant David\\\" (34:23). Jesus claims to be the good shepherd, enacting what God promised to do personally and what God promised to accomplish through the Davidic shepherd-king. The dual claim -- shepherd and one with the Father -- will become explicit in verse 30.\\n\\n**\\\"The good shepherd lays down his life for the sheep\\\" (ho poimen ho kalos ten psychen autou tithesi hyper ton probaton).** The phrase \\\"lays down his life\\\" (ten psychen tithesi) is distinctive. The verb tithemi means \\\"to place, set down, put.\\\" It is a deliberate, intentional act -- not having life taken but placing it down. The preposition hyper (\\\"for, on behalf of\\\") indicates substitutionary or representative action, the same preposition used in 6:51 (\\\"the bread which I will give for [hyper] the life of the world is my flesh\\\"). The good shepherd does not merely risk his life for the sheep; he lays it down -- voluntarily, deliberately, in their place. This is the first explicit statement in the document that Jesus will die for others, though the language has been building: John the Baptist identified him as \\\"the Lamb of God who takes away the sin of the world\\\" (1:29); Jesus spoke of his flesh given \\\"for the life of the world\\\" (6:51); the \\\"lifting up\\\" of 3:14 and 8:28 pointed to the cross. Now the act is described in shepherd terms: the shepherd puts his life between the wolf and the sheep.\\n\\n**\\\"He who is a hired hand, and not a shepherd, who is not the owner of the sheep.\\\"** The hired hand (misthotos, \\\"one who works for wages\\\") is distinguished from the shepherd by ownership and motivation. The shepherd's sheep are \\\"his own\\\" (idia, vv. 3-4); the hired hand's are not. The hired hand works for pay, not for love of the sheep. This figure directly targets the religious leaders of chapter 9, who treated the flock as a source of their own authority and status, not as a charge entrusted to them by God. The hired hand is not identical to the thief -- the thief intends to destroy; the hired hand merely does not care enough to protect. Both fail the sheep, but for different reasons.\\n\\n**\\\"Sees the wolf coming, and leaves the sheep and flees, and the wolf snatches them and scatters them.\\\"** The wolf (lykos) is the natural predator of the flock. In Israel's prophetic literature, wolves represent foreign oppressors and corrupt rulers. Ezekiel 22:27: \\\"Her princes within her are like wolves tearing the prey, by shedding blood and destroying lives in order to get dishonest gain.\\\" Zephaniah 3:3: \\\"Her judges are wolves of the evening; they leave nothing for the morning.\\\" The wolf's two actions -- snatching (harpazei) and scattering (skorpizei) -- are precisely the actions the Pharisees have performed in chapter 9. They snatched the healed man from Jesus's influence by interrogating and threatening him, and they scattered the flock by making an example of anyone who confessed Jesus (9:22: \\\"the Jews had already agreed that if anyone confessed him to be Christ, he was to be put out of the synagogue\\\"). The hired hand's response -- leaving and fleeing -- is the abdication of protective responsibility.\\n\\nThe verb harpazei (\\\"snatches\\\") will return in verse 28 (\\\"no one will snatch them out of my hand\\\") and verse 29 (\\\"no one is able to snatch them out of the Father's hand\\\"). The same verb used for the wolf's predatory action is then used to describe what cannot be done to the sheep under the good shepherd's protection. The wolf snatches; but no one -- no wolf, no thief, no robber -- can snatch the sheep from the shepherd who has laid down his life for them.\\n\\n**\\\"I am the good shepherd, and I know my own and my own know me, even as the Father knows me and I know the Father.\\\"** The mutual knowledge between shepherd and sheep is modeled on the mutual knowledge between Father and Son. This is an extraordinary analogy. The intimacy between Jesus and his sheep is compared to the intimacy between Jesus and the Father -- the most profound relationship in the document (1:1, \\\"the Word was with God\\\"; 1:18, \\\"the only begotten God who is in the bosom of the Father\\\"). The verb ginosko (\\\"to know\\\") in this document carries the weight of relational, experiential knowledge -- not abstract awareness but intimate acquaintance. The knowledge is reciprocal: the shepherd knows the sheep, the sheep know the shepherd. This reciprocity was established in verses 3-5 (the shepherd calls by name; the sheep hear his voice) and is now grounded in the deepest possible reality: the Father-Son relationship.\\n\\n**\\\"I lay down my life for the sheep.\\\"** The phrase is repeated from verse 11, now in the first person. The emphasis on voluntary self-sacrifice intensifies: the shepherd does not merely protect the sheep while alive; he gives his life as the act of protection itself. The laying down of life is not a regrettable consequence of shepherding but its defining act.\\n\\n**\\\"I have other sheep, which are not of this fold; I must bring them also, and they will hear my voice; and they will become one flock with one shepherd\\\" (kai alla probata echo ha ouk estin ek tes aules tautes; kakeina dei me agagein, kai tes phones mou akousousin, kai genesontai mia poimne heis poimen).** The \\\"other sheep\\\" (alla probata) are distinguished from \\\"this fold\\\" (tes aules tautes). \\\"This fold\\\" is the current enclosure -- Israel, specifically the community of Jewish followers. The \\\"other sheep\\\" are those outside this fold who will also hear Jesus's voice and be gathered in. The most natural first-century referent is the Gentile nations. This interpretation is confirmed by the document's own trajectory: in 4:42, Jesus was confessed as \\\"the Savior of the world\\\" (not only of Israel); in 11:52, the author will gloss Caiaphas's prophecy as meaning that Jesus would die \\\"not for the nation only, but in order that he might also gather together into one the children of God who are scattered abroad\\\"; in 12:20-24, Greeks come seeking Jesus, and Jesus responds by speaking of his death as the means of bearing \\\"much fruit.\\\"\\n\\nThe verb \\\"I must bring\\\" (dei me agagein) uses the word dei (\\\"it is necessary\\\"), which in this document indicates divine necessity -- what the Father's plan requires (3:7, \\\"you must be born again/from above\\\"; 3:14, \\\"the Son of Man must be lifted up\\\"; 4:4, \\\"he had to pass through Samaria\\\"; 9:4, \\\"we must work the works of him who sent me\\\"; 12:34, \\\"the Son of Man must be lifted up\\\"). The gathering of the other sheep is not optional but is part of the Father's determined plan.\\n\\nThe promise is: \\\"they will hear my voice\\\" (tes phones mou akousousin) -- future tense, a certainty, not merely a hope. And the result: \\\"one flock, one shepherd\\\" (mia poimne, heis poimen). The background is Ezekiel 37:24: \\\"My servant David shall be king over them, and they shall all have one shepherd (poimen heis).\\\" The LXX of Ezekiel 37:24 uses the same phrase. The \\\"one flock\\\" also recalls Ezekiel 37:15-23, where God promises to unite the divided kingdoms of Israel and Judah into one nation with one king: \\\"I will make them one nation in the land, on the mountains of Israel, and one king shall be king for all of them; and they will no longer be two nations and no longer be divided into two kingdoms\\\" (37:22). The scope is now broader than the reunion of Israel's divided kingdoms; it encompasses the gathering of all God's scattered children -- Jewish and Gentile -- into one flock under one shepherd.\\n\\n**\\\"For this reason the Father loves me, because I lay down my life so that I may take it again\\\" (dia touto me ho pater agapai hoti ego tithemi ten psychen mou, hina palin labo auten).** The Father's love for the Son is not caused by the act of self-sacrifice (the Father loved the Son before the foundation of the world, 17:24), but the voluntary laying down of life is identified as a reason for the Father's love. The phrase \\\"so that I may take it again\\\" (hina palin labo auten) introduces the resurrection: the purpose of laying down life is not extinction but recovery -- death is the means of obtaining life again. The death is purposeful, not tragic. It serves the \\\"taking again\\\" -- the resurrection -- which is the gateway to the glorification the author will develop in chapters 12-17.\\n\\n**\\\"No one has taken it away from me, but I lay it down on my own initiative\\\" (oudeis eirei auten ap' emou, all' ego tithemi auten ap' emautou).** The verb airo (\\\"to take, take away, remove\\\") is present tense: \\\"no one takes it from me.\\\" Even in the events of his arrest and execution, no one is the effective agent of Jesus's death except Jesus himself. The soldiers, the high priest, Pilate -- none of them can take his life. He places it down on his own initiative (ap' emautou, \\\"from myself\\\"). This statement will govern the reader's understanding of the passion narrative: when Jesus is arrested in the garden and the soldiers fall back at his \\\"I am\\\" (18:6), when he tells Pilate \\\"You would have no authority over me unless it had been given you from above\\\" (19:11), when he declares \\\"It is finished\\\" and \\\"gives up\\\" his spirit (19:30) -- at every point, the passion is Jesus's deliberate act, not his defeat.\\n\\n**\\\"I have authority to lay it down, and I have authority to take it up again\\\" (exousian echo theinai auten, kai exousian echo palin labein auten).** The word exousia (\\\"authority, right, power\\\") establishes that both the dying and the rising are within Jesus's legitimate power. The authority to lay down life echoes 5:26-27: \\\"He gave to the Son also to have life in himself; and he gave him authority (exousian) to execute judgment.\\\" The authority to take it up again is the authority over death that 5:21 claimed: \\\"For just as the Father raises the dead and gives them life, even so the Son also gives life to whom he wishes.\\\" Both authorities -- over death and over resurrection -- are exercised in the single act of the shepherd laying down his life for the sheep and taking it up again.\\n\\n**\\\"This commandment I received from my Father\\\" (tauten ten entolen elabon para tou patros mou).** The word entole (\\\"commandment\\\") grounds the entire self-sacrifice in the Father's will, not in Jesus's independent decision. The death is voluntary (Jesus lays it down of his own initiative) and commanded (the Father has given this commandment). The two are not contradictory: Jesus's initiative and the Father's command are perfectly aligned because the Son does only what the Father wills (5:19, 30; 6:38; 8:29). The commandment to die and rise is the mission itself -- the reason the Father sent the Son (3:16-17). The shepherd's death is not a tragic accident or a human overreach; it is the Father's plan, executed by the Son in perfect freedom.\\n\\n---\\n\\n## Verses 19-21: Division Again\\n\\n\\\"A division occurred again among the Jews because of these words. Many of them were saying, 'He has a demon and is insane. Why do you listen to him?' Others were saying, 'These are not the sayings of one demon-possessed. A demon cannot open the eyes of the blind, can he?'\\\"\\n\\n**\\\"A division occurred again\\\" (schisma palin egeneto en tois Ioudaiois).** The word schisma (\\\"division, split\\\") appeared previously in 7:43 (at the Feast of Tabernacles) and 9:16 (among the Pharisees over the blind man's healing). The pattern is consistent throughout the document: Jesus's words and works produce division, not consensus. The light separates those who come to it from those who flee (3:19-21). The shepherd's voice distinguishes those who hear from those who do not (10:3-5).\\n\\n**\\\"He has a demon and is insane\\\" (daimonion echei kai mainetai).** The charge of demonic possession appeared in 7:20 (\\\"You have a demon! Who seeks to kill you?\\\") and 8:48 (\\\"Do we not say rightly that you are a Samaritan and have a demon?\\\") and 8:52 (\\\"Now we know that you have a demon\\\"). The accusation is the opponents' explanation for speech they cannot comprehend: if Jesus's words are beyond their categories, the source must be demonic. The addition of \\\"insane\\\" (mainetai, \\\"he is mad, raving\\\") intensifies the dismissal -- not merely deceived but deranged. The irony is thick: the one through whom all things were made (1:3), who carries life in himself (1:4), who speaks the Father's words (3:34), is accused of madness and demonic influence.\\n\\n**\\\"These are not the sayings of one demon-possessed. A demon cannot open the eyes of the blind, can he?\\\"** The defense comes not from Jesus but from the crowd itself. Their reasoning is empirical: the signs -- specifically the healing of the man born blind from chapter 9 -- are evidence that Jesus is not demonized. A demon destroys; it does not heal. The question \\\"A demon cannot open the eyes of the blind, can he?\\\" (me daimonion dynatai typhlon ophthalmous anoixai) expects a negative answer. The sign carries its own testimonial force: the work testifies to the worker's identity, as Jesus argued in 5:36 (\\\"the works which the Father has given me to accomplish -- the very works that I do -- testify about me, that the Father has sent me\\\"). The healing of the blind was understood in Israel's prophetic tradition as a sign of the messianic age: Isaiah 29:18, \\\"On that day the deaf will hear words of a book, and out of their gloom and darkness the eyes of the blind will see.\\\" Isaiah 35:5, \\\"Then the eyes of the blind will be opened and the ears of the deaf will be unstopped.\\\" Isaiah 42:7, describing the servant of the LORD: \\\"to open blind eyes, to bring out prisoners from the dungeon.\\\" The opening of blind eyes was God's own promised work, and no demon performs God's work.\\n\\n---\\n\\n## The Feast of Dedication (Hanukkah): Background for Verses 22-39\\n\\nThe narrative now advances to a new setting: the Feast of Dedication in winter. The background of this festival is essential for hearing what follows.\\n\\nThe Feast of Dedication (Hanukkah, from the Hebrew chanukah, \\\"dedication\\\") commemorated the rededication of the temple by Judas Maccabeus in 164 BCE, after Antiochus IV Epiphanes had desecrated it by erecting an altar to Zeus in the holy place and sacrificing swine on the altar (1 Maccabees 1:54-59, 4:36-59; 2 Maccabees 10:1-8). The Maccabean revolt restored Jewish worship and political independence. The festival lasted eight days and was celebrated with lights (Josephus calls it \\\"the festival of lights,\\\" Antiquities 12.325), singing the Hallel psalms, and communal rejoicing.\\n\\nSeveral features of Hanukkah are relevant to the confrontation in verses 22-39:\\n\\n1. **The temple is central.** Hanukkah celebrates the temple's purification and rededication. Jesus is in the temple during this festival (v. 23), and the question put to him -- whether he is the Christ -- is asked in the space whose dedication the festival celebrates. Jesus has already claimed that his body is the true temple (2:19-21). The festival celebrates the dedication of a building; Jesus claims to be the reality that the building represented.\\n\\n2. **The question of legitimate authority.** The Maccabees fought against foreign rulers who had profaned God's house and installed false worship. The festival thus celebrated the overthrow of illegitimate authority and the restoration of legitimate worship. Jesus has just been discussing legitimate and illegitimate shepherds. The Pharisees and chief priests claim legitimate authority over Israel's worship; Jesus's discourse has declared them thieves and hired hands.\\n\\n3. **The concept of consecration/dedication.** The Hebrew root chanakh and the Greek verb egkainizo (\\\"to dedicate, renew, consecrate\\\") describe the setting apart of something for God's use. Jesus will use related language in verse 36: \\\"do you say of him whom the Father consecrated (hegiasen) and sent into the world, 'You are blaspheming'?\\\" The verb hagiazo (\\\"to consecrate, make holy, sanctify\\\") applies to Jesus what Hanukkah celebrates for the temple: Jesus is the one the Father has consecrated. The festival celebrates the dedication of a temple; Jesus claims to be the one whom God himself has dedicated.\\n\\n---\\n\\n## Verses 22-30: \\\"My Sheep Hear My Voice\\\" and \\\"I and the Father Are One\\\"\\n\\n\\\"At that time the Feast of the Dedication took place at Jerusalem; it was winter, and Jesus was walking in the temple in the portico of Solomon. The Jews then gathered around him, and were saying to him, 'How long will you keep us in suspense? If you are the Christ, tell us plainly.' Jesus answered them, 'I told you, and you do not believe; the works that I do in my Father's name, these testify of me. But you do not believe because you are not of my sheep. My sheep hear my voice, and I know them, and they follow me; and I give them eternal life, and they will never perish, and no one will snatch them out of my hand. My Father, who has given them to me, is greater than all; and no one is able to snatch them out of the Father's hand. I and the Father are one.'\\\"\\n\\n**\\\"It was winter\\\" (cheimōn en).** The detail is unusual for this author, who typically marks time by festivals rather than seasons. The mention of winter may be atmospheric -- the cold, inhospitable season contrasting with the hostility Jesus faces -- or it may be chronological, indicating that several months have elapsed since the Tabernacles setting of chapters 7-8 (Tabernacles falls in September-October; Hanukkah falls in November-December). The narrative has jumped forward in time; the shepherd discourse of verses 1-18 (which continued the chapter 9 confrontation at Tabernacles) is now followed by a scene set at a later festival.\\n\\n**\\\"Jesus was walking in the temple in the portico of Solomon\\\" (periepatei ho Iesous en to hiero en te stoa tou Solomonos).** Solomon's Colonnade was a covered portico along the eastern side of the temple mount, believed to be a remnant of Solomon's original temple. It was a natural gathering place for teaching and discussion (Acts 3:11, 5:12). Jesus walks in the place associated with the king who built the first temple -- the king who was David's son and shepherd of Israel. The setting places Jesus in the space of the Davidic shepherd-king during the festival that celebrates the temple's rededication.\\n\\n**\\\"How long will you keep us in suspense? If you are the Christ, tell us plainly\\\" (heos pote ten psychen hemon aireis; ei sy ei ho Christos, eipe hemin parresia).** The demand for a plain declaration (parresia, \\\"openly, boldly, without figures\\\") echoes the frustration of 7:26 (\\\"The rulers do not really know that this is the Christ, do they?\\\") and 8:25 (\\\"Who are you?\\\"). The question sounds reasonable: just tell us directly. But Jesus's response reveals why a plain answer would not accomplish what they expect. The problem is not that Jesus has been unclear; the problem is that they have not believed what he has already said and done.\\n\\n**\\\"I told you, and you do not believe; the works that I do in my Father's name, these testify of me.\\\"** Jesus's answer is: the declaration has already been made -- through his works. The works (erga) testify (martyrousin). This is the same argument from 5:36: \\\"the very works that I do testify about me, that the Father has sent me.\\\" The healing at the pool, the feeding of the multitude, the opening of the blind man's eyes -- each is a declaration made in the Father's name. The authorities' demand for a plain verbal statement ignores the testimony of the works, which is the testimony of the Father himself (5:37). The demand for more words is an evasion: they have not believed the evidence already given.\\n\\n**\\\"But you do not believe because you are not of my sheep\\\" (alla hymeis ou pisteuete, hoti ouk este ek ton probaton ton emon).** This is a diagnostic statement, not a prescriptive one. Jesus does not say \\\"you cannot become my sheep\\\" or \\\"you are excluded from ever becoming my sheep.\\\" He says that their current unbelief is explained by the fact that they are not, at this moment, acting as his sheep -- hearing his voice, following him. The phrase \\\"not of my sheep\\\" (ouk este ek ton probaton ton emon) describes their present condition and identifies it as the reason for their unbelief. In the same way, 8:47 said: \\\"He who is of God hears the words of God; for this reason you do not hear them, because you are not of God.\\\" The diagnosis works from the symptom (you do not believe) to the condition (you are not of my sheep). Their failure to hear and follow is what makes them not-sheep, and their not-being-sheep is what explains their failure to believe. The two are mutually defining: sheep hear; these do not hear; therefore they are not sheep.\\n\\nThis must be read alongside the author's earlier statements about how one becomes \\\"of God\\\" or becomes one of Jesus's sheep. In 6:45, the mechanism is hearing and learning from the Father: \\\"Everyone who has heard and learned from the Father, comes to me.\\\" In 7:17, the prerequisite is willingness: \\\"If anyone is willing to do his will, he will know of the teaching.\\\" In 8:47, the condition is being \\\"of God\\\" -- oriented toward God. The Pharisees' exclusion from the sheep is not an arbitrary divine decree but the consequence of their own refusal to hear, learn, and follow. The man born blind demonstrated that a person can move from outside to inside -- from not knowing Jesus (9:12, \\\"I do not know\\\") to worshiping him (9:38). The Pharisees' present condition is self-imposed: they claim to see but refuse to look (9:41).\\n\\n**\\\"My sheep hear my voice, and I know them, and they follow me\\\" (ta probata ta ema tes phones mou akouousin, kago ginosko auta, kai akolouthousin moi).** Three present-tense verbs describe the sheep: they hear (akouousin), they are known by the shepherd (ginosko), and they follow (akolouthousin). The present tense is consistent and significant. These are not past-tense accomplishments but ongoing activities. The sheep are defined by what they are currently doing: hearing, being known, following. This matches the present-tense pattern throughout the document: \\\"the one believing\\\" (ho pisteuon, 3:16, 18, 36; 6:35, 40, 47), \\\"the one coming\\\" (ho erchomenos, 6:35), \\\"the one eating\\\" (ho trogon, 6:54, 56, 57, 58). The condition described is an ongoing state, not a completed transaction. The sheep's identity is constituted by their continuous activity of hearing and following.\\n\\n**\\\"And I give them eternal life, and they will never perish\\\" (kago didomi autois zoen aionion, kai ou me apolontai eis ton aiona).** The verb \\\"give\\\" (didomi) is present tense -- \\\"I am giving\\\" them eternal life. This is the life the document has been describing since the prologue: the life that was in the Word (1:4), the eternal life promised to those who believe (3:16, 36; 5:24; 6:40, 47, 54). The promise \\\"they will never perish\\\" (ou me apolontai) uses the double negative ou me (the strongest negation in Greek) with the verb apollymi (\\\"to perish, be destroyed, be lost\\\"). This is the same verb used in 3:16 (\\\"should not perish but have eternal life\\\") and in 6:39 (\\\"that I lose nothing\\\"). The promise is emphatic: these sheep will not perish.\\n\\nBut the identity of \\\"these sheep\\\" must be determined by the preceding verse: they are the ones hearing, being known, and following. The promise of not perishing is made to the sheep in their capacity as hearing-and-following sheep. The text does not address what happens if a sheep stops hearing and following -- it describes the condition and promise for those who are currently in the described state. This is parallel to 3:16: \\\"everyone who believes [present tense, ho pisteuon] will not perish but have eternal life.\\\" The promise is for the one who is believing. The question of whether a person can stop believing -- and what happens if they do -- is addressed elsewhere in the document (6:66, where disciples who had been following ceased to follow; 15:2, 6, where branches that do not abide are removed).\\n\\n**\\\"And no one will snatch them out of my hand\\\" (kai ouch harpasei tis auta ek tes cheiros mou).** The verb harpazo (\\\"to snatch, seize, take by force\\\") returns from verse 12, where the wolf \\\"snatches\\\" the sheep, and from 6:15, where the crowd tried to \\\"take Jesus by force\\\" to make him king. The statement addresses external threats: no thief, no wolf, no hired hand, no hostile authority can forcibly remove the sheep from the shepherd's grasp. The hand (cheir) represents power and protective authority. In the LXX, \\\"the hand of the LORD\\\" is the standard idiom for God's saving power: Deuteronomy 33:3, \\\"Indeed, all your holy ones are in your hand\\\" (en te cheiri sou); Isaiah 49:16, \\\"Behold, I have inscribed you on the palms of my hands\\\"; Psalm 95:7 (LXX 94:7), \\\"For he is our God, and we are the people of his pasture and the sheep of his hand\\\" -- a text that combines the shepherd-sheep image with the hand image in the same verse.\\n\\nThe promise concerns external predation. The wolf snatches (v. 12), but no one can snatch from Jesus's hand. The thieves steal, kill, and destroy (v. 10), but they cannot overcome the shepherd who has laid down his life. The assurance is that no outside force can separate the sheep from the shepherd's protection. What the text does not address is the sheep's own choice to leave -- to stop hearing, stop following, walk away. The document has already demonstrated that disciples can do precisely this (6:66: \\\"many of his disciples withdrew and were not walking with him anymore\\\"). The departure in 6:66 was not a snatching by a wolf but a voluntary turning back. The promise of verse 28 protects against the wolf; it does not address the sheep that wanders. This is consistent with the Ezekiel 34 background, which distinguishes between threats from outside the flock (wolves, bears, lions) and judgment within the flock itself (Ezekiel 34:17-22: God judges \\\"between sheep and sheep, between the rams and the male goats\\\").\\n\\n**\\\"My Father, who has given them to me, is greater than all; and no one is able to snatch them out of the Father's hand\\\" (ho pater mou ho dedoken moi panton meizon estin, kai oudeis dynatai harpazein ek tes cheiros tou patros).** The protective assurance is now doubled: the sheep are in Jesus's hand (v. 28) and in the Father's hand (v. 29). The Father \\\"who has given them to me\\\" echoes the giving language of 6:37 (\\\"All that the Father gives me will come to me\\\") and 6:39 (\\\"of all that he has given me I lose nothing\\\"). The Father's role is the giving; the Son's role is the receiving and keeping. The Father is \\\"greater than all\\\" (panton meizon) -- no force in the universe exceeds the Father's power. If the sheep are in the Father's hand, no external agent can extract them. The double assurance -- Jesus's hand and the Father's hand -- prepares for the next statement, which explains why these two hands provide a single, unified protection.\\n\\n**\\\"I and the Father are one\\\" (ego kai ho pater hen esmen).** This is the climactic declaration of the passage, and its meaning must be determined by the author's own usage and by the immediate context.\\n\\nThe word \\\"one\\\" (hen) is neuter, not masculine (heis). If Jesus had said ego kai ho pater heis esmen (\\\"I and the Father are one person\\\"), it would be a claim to be the same individual as the Father. But hen (neuter) means \\\"one thing\\\" -- one in nature, purpose, will, and action. The distinction between Father and Son is maintained throughout the document: the Son is sent by the Father (3:17, 5:36, 6:57, 7:29, 8:42, 10:36), does the Father's will (4:34, 5:30, 6:38), speaks the Father's words (3:34, 7:16, 8:28, 12:49-50), and returns to the Father (13:1, 14:12, 16:28, 20:17). The Father and Son are not interchangeable; they are one in the shared purpose, authority, and protective power that the shepherd discourse has been describing. What the Father does, the Son does (5:19). The Father's hand and the Son's hand are not two separate protections but one unified custody, because the Father and the Son are one in their shepherding of the flock.\\n\\nThe Ezekiel 34 background provides the scriptural foundation: God promised both that \\\"I myself will be the shepherd of my sheep\\\" (34:15) and that \\\"I will set up over them one shepherd, my servant David\\\" (34:23). The two promises are not in tension because the Davidic shepherd exercises God's own shepherding. Jesus's declaration \\\"I and the Father are one\\\" is the fulfillment of both promises simultaneously: the shepherd is the Davidic king, and the Davidic king is one with God in the act of shepherding. This is not a philosophical assertion about the metaphysics of the divine nature but a functional declaration about the unity of purpose and power between Father and Son in the act of protecting and giving life to the sheep.\\n\\n---\\n\\n## Verses 31-39: The Stoning Attempt and the Argument from Psalm 82\\n\\n\\\"The Jews picked up stones again to stone him. Jesus answered them, 'I showed you many good works from the Father; for which of them are you stoning me?' The Jews answered him, 'For a good work we do not stone you, but for blasphemy; and because you, being a man, make yourself God.' Jesus answered them, 'Has it not been written in your Law, \\\"I said, you are gods\\\"? If he called them gods, to whom the word of God came (and the Scripture cannot be broken), do you say of him, whom the Father sanctified and sent into the world, \\\"You are blaspheming,\\\" because I said, \\\"I am the Son of God\\\"? If I do not do the works of my Father, do not believe me; but if I do them, though you do not believe me, believe the works, so that you may know and understand that the Father is in me, and I in the Father.' Therefore they were seeking again to seize him, and he eluded their grasp.\\\"\\n\\n**\\\"The Jews picked up stones again to stone him.\\\"** The word \\\"again\\\" (palin) connects this to 8:59, where the authorities took up stones after Jesus's declaration \\\"Before Abraham was, I am.\\\" The escalation is consistent: the claims Jesus makes produce the charge of blasphemy, which under Jewish law warranted stoning (Leviticus 24:16: \\\"whoever blasphemes the name of the LORD shall surely be put to death; all the congregation shall stone him\\\"). The pattern is the same in both cases: Jesus makes a statement that the authorities hear as a claim to divinity; they respond with lethal force.\\n\\n**\\\"I showed you many good works from the Father; for which of them are you stoning me?\\\"** Jesus's response redirects the conversation from the verbal claim (\\\"I and the Father are one\\\") to the visible evidence (the works). The adjective \\\"good\\\" (kala) uses the same word as \\\"good shepherd\\\" (kalos) -- these are noble, excellent, beautiful works. They are \\\"from the Father\\\" (ek tou patros) -- their origin is divine. Jesus's question forces the opponents to evaluate what they have seen rather than react to what they have heard.\\n\\n**\\\"For a good work we do not stone you, but for blasphemy; and because you, being a man, make yourself God.\\\"** The authorities articulate their understanding of the offense: Jesus, a human being, claims to be God. They heard \\\"I and the Father are one\\\" as a claim to deity. Their reading is not incorrect -- Jesus has been claiming functions that belong to God alone (giving life, judging, forgiving sins, receiving worship) -- but their response assumes that no human being could legitimately bear these functions. They separate \\\"being a man\\\" from \\\"being God\\\" as mutually exclusive categories. The entire thrust of the prologue (\\\"the Word became flesh,\\\" 1:14) challenges this assumption: the Word was God (1:1) and became flesh (1:14). The categories the authorities treat as exclusive are, in this author's presentation, united in a single person.\\n\\n**\\\"Has it not been written in your Law, 'I said, you are gods'?\\\"** Jesus quotes Psalm 82:6 (LXX 81:6). The psalm depicts God standing in the divine assembly (en synagoge theon, \\\"in the assembly of the gods\\\") and judging those who judge Israel unjustly. God addresses these judges: \\\"I said, 'You are gods (theoi este), and all of you are sons of the Most High (huioi hypsistou pantes).' Nevertheless you will die like men and fall like one of the princes\\\" (Psalm 82:6-7). The \\\"gods\\\" (theoi/elohim) of Psalm 82 are human rulers or judges of Israel who have been entrusted with God's authority to administer justice. They are called \\\"gods\\\" because they exercise a divine function -- judging -- on God's behalf. But they will die like men because they have exercised this function corruptly.\\n\\nThe phrase \\\"your Law\\\" (en to nomo hymon) extends the term \\\"Law\\\" beyond the Pentateuch to include the Psalms, which is consistent with broader first-century usage where \\\"the Law\\\" could designate the entire scriptures (cf. 12:34, 15:25, where Jesus cites Psalms as \\\"the Law\\\").\\n\\n**\\\"If he called them gods, to whom the word of God came (and the Scripture cannot be broken).\\\"** The argument is qal va-homer -- from the lesser to the greater, the same form of reasoning Jesus used in 7:23 (the circumcision-versus-healing argument). The lesser case: the scriptures applied the title \\\"gods\\\" (theoi) to human judges who received God's word. If the scripture itself calls mere humans \\\"gods\\\" in a limited, derivative sense -- humans to whom the word of God came -- then the greater case: how can it be blasphemy for the one whom the Father consecrated and sent into the world to say \\\"I am the Son of God\\\"?\\n\\nThe parenthetical \\\"the Scripture cannot be broken\\\" (ou dynatai lythenai he graphe) is a striking affirmation of scriptural authority. The verb lyo (\\\"to loose, break, dissolve\\\") means that scripture's declarations cannot be nullified or set aside. If Psalm 82 called human judges \\\"gods,\\\" that verdict stands and cannot be overturned. Jesus's argument builds on his opponents' own authority -- the inviolability of scripture -- to establish that his claim is, at the very least, consistent with scriptural precedent.\\n\\n**\\\"Do you say of him, whom the Father sanctified and sent into the world, 'You are blaspheming,' because I said, 'I am the Son of God'?\\\"** Two elements require attention:\\n\\n1. **\\\"Whom the Father sanctified\\\" (hon ho pater hegiasen).** The verb hagiazo (\\\"to sanctify, consecrate, set apart, dedicate\\\") connects directly to the festival context. The Feast of Dedication celebrates the consecration (chanukah) of the temple. Jesus claims that the Father has consecrated him. He is the dedicated one -- not a building but a person, set apart by God for God's purpose. The temple was dedicated for God's presence to dwell there; Jesus, in whom \\\"all the fullness of deity\\\" tabernacles (to use later apostolic language, though this document makes the point in its own way: \\\"the Word became flesh and tabernacled among us,\\\" 1:14), is the reality the temple anticipated.\\n\\n2. **\\\"I am the Son of God\\\" (huios tou theou eimi).** Jesus frames his claim not as \\\"I am God\\\" but as \\\"I am the Son of God.\\\" The title \\\"Son of God\\\" (huios tou theou) has appeared throughout the document: the Baptist's testimony (1:34), Nathanael's confession (1:49), Jesus's own self-reference through the discourse of chapter 5 (5:19-26), and Martha's coming confession (11:27). The title, in its scriptural background, applies to the Davidic king. 2 Samuel 7:14: \\\"I will be a father to him, and he will be a son to me.\\\" Psalm 2:7: \\\"He said to me, 'You are my Son; today I have begotten you.'\\\" Psalm 89:26-27: \\\"He will cry to me, 'You are my Father, my God, and the rock of my salvation.' I also shall make him my firstborn, the highest of the kings of the earth.\\\" The title \\\"Son of God\\\" carries royal-messianic significance: the Davidic king is God's son in a special, covenantal sense. Jesus's argument is that if human judges can be called \\\"gods\\\" by scripture, how much more can the one whom God consecrated and sent claim the title \\\"Son of God.\\\"\\n\\nThe argument does not retreat from the earlier claim (\\\"I and the Father are one\\\"); it reframes it in terms the opponents should be able to accept. If scripture's own usage permits calling human judges \\\"gods,\\\" the threshold for blasphemy is higher than the opponents assume. And the one making the claim is not a mere human judge but the one uniquely consecrated and sent by the Father.\\n\\n**\\\"If I do not do the works of my Father, do not believe me; but if I do them, though you do not believe me, believe the works.\\\"** Jesus offers an empirical test: judge by the works. This is the same argument from 5:36 and 10:25. If the works do not match the Father's character, reject the claim. But if they do -- if the healing of the paralyzed, the feeding of the hungry, the opening of the blind -- match what God himself promised to do (Isaiah 35:5-6, Ezekiel 34:16), then let the works settle the question, even if the verbal claim seems incredible.\\n\\n**\\\"So that you may know and understand that the Father is in me, and I in the Father\\\" (hina gnote kai ginoskete hoti en emoi ho pater kago en to patri).** The mutual indwelling -- \\\"the Father in me, I in the Father\\\" -- restates \\\"I and the Father are one\\\" in relational rather than numerical terms. The preposition en (\\\"in\\\") describes interpenetration, mutual presence: the Father's presence in Jesus and Jesus's presence in the Father. This is not the language of identity (they are the same person) but of inseparability (each is present in the other). The same mutual-indwelling language will be extended to the relationship between Jesus and believers in 14:20 (\\\"You will know that I am in my Father, and you in me, and I in you\\\") and 15:4 (\\\"Abide in me, and I in you\\\"). The intimacy that defines the Father-Son relationship is the model and basis for the shepherd-sheep relationship.\\n\\n**\\\"Therefore they were seeking again to seize him, and he eluded their grasp.\\\"** The verb ezercheto (\\\"he went out\\\") indicates departure; the phrase exelthen ek tes cheiros auton (\\\"he eluded their grasp,\\\" literally \\\"he went out from their hand\\\") is rich in irony. The opponents cannot even keep hold of Jesus's physical person, let alone snatch his sheep from his hand (v. 28). Their hand cannot hold him; his hand cannot be overcome. The divine sovereignty over the \\\"hour\\\" continues to operate: they cannot arrest him because the time has not yet arrived (as in 7:30, 44; 8:20, 59).\\n\\n---\\n\\n## Verses 40-42: Beyond the Jordan\\n\\n\\\"And he went away again beyond the Jordan to the place where John was first baptizing, and he was staying there. Many came to him and were saying, 'While John performed no sign, yet everything John said about this man was true.' Many believed in him there.\\\"\\n\\n**\\\"Beyond the Jordan to the place where John was first baptizing.\\\"** The geographic detail creates an inclusio -- a literary bracket. The document began with John's testimony at this same location: \\\"These things took place in Bethany beyond the Jordan, where John was baptizing\\\" (1:28). The public ministry that began at the Jordan now pauses at the Jordan. The circle is closing. From here, the narrative will move to Bethany near Jerusalem for the raising of Lazarus (chapter 11), and from Lazarus's raising to the final Passover.\\n\\nThe return to the baptismal site recalls the testimony John gave there: \\\"Behold, the Lamb of God who takes away the sin of the world\\\" (1:29), \\\"I have seen the Spirit descending as a dove out of heaven, and he remained upon him\\\" (1:32), \\\"This is the Son of God\\\" (1:34). These declarations -- lamb, Spirit-bearer, Son of God -- have now been filled with content through ten chapters of narrative. The reader who returns to the Jordan with Jesus hears John's earlier words with the depth the intervening narrative has provided.\\n\\n**\\\"John performed no sign, yet everything John said about this man was true.\\\"** The crowd's observation is significant for the author's theology of witness. John's role was testimony, not signs (1:7: \\\"He came as a witness, to testify about the light\\\"). He was the voice, not the light (1:8, 1:23). Yet his testimony is vindicated by the signs Jesus has performed. The crowd recognizes the alignment: what John said (testimony) matches what Jesus has done (works). The two forms of witness -- verbal and visible -- converge. John's words were true; Jesus's works confirm them. The author's careful presentation of John as a witness rather than a rival (1:8, 1:15, 1:20, 1:27, 3:28-30) reaches its conclusion here: the witness's testimony has been validated by the one he testified about.\\n\\n**\\\"Many believed in him there\\\" (kai polloi episteusan eis auton ekei).** The aorist episteusan (\\\"believed\\\") records the response at that location. Beyond the Jordan, away from the hostile Jerusalem authorities, in the place where John first testified, many come to belief. The pattern is consistent with the document's geography: belief flourishes away from the center of institutional power. The Samaritans believed (4:39-41), the Galilean crowd initially followed (6:2), and now the Transjordanians believe. Jerusalem remains the place of confrontation and rejection. The contrast reinforces Ezekiel 34's indictment: the failure is in the shepherds, not in the sheep. When the sheep hear the shepherd's voice without the interference of the hired hands and thieves, many respond.\\n\\n---\\n\\n## Summary of the Chapter's Argument\\n\\n1. **The chapter is an interpretive commentary on the events of chapter 9, cast in the language of Ezekiel 34.** There is no scene break between 9:41 and 10:1. Jesus addresses the Pharisees who have just expelled the healed man and tells them what their action reveals: they are not shepherds but thieves and hired hands. The shepherd discourse is not an abstract teaching about pastoral ministry; it is a prophetic indictment of Israel's current leaders, drawing on Ezekiel's indictment of Israel's historical leaders. The Pharisees have \\\"scattered the sheep\\\" (by expelling the believing man), \\\"not healed the sick\\\" (by refusing to acknowledge the sign), and \\\"fed themselves\\\" (by preserving their authority at the expense of the flock). God's response in Ezekiel was to declare: \\\"I myself will be the shepherd of my sheep.\\\" Jesus now enacts that declaration.\\n\\n2. **The chapter contains two \\\"I am\\\" statements with predicates -- the door (vv. 7, 9) and the good shepherd (vv. 11, 14) -- both drawn from the same image.** As the door, Jesus is the point of legitimate access to the flock and the barrier against illegitimate entry. As the good shepherd, Jesus is the one who calls, knows, leads, protects, and dies for the sheep. The two identifications are complementary: Jesus is both the means of entry and the one who enters. The dual imagery ensures that no aspect of the flock's protection and provision falls outside his role.\\n\\n3. **The chapter's central claim is that Jesus is the fulfillment of Ezekiel 34's double promise: God shepherding Israel himself and raising up a Davidic shepherd-king.** The declaration \\\"I and the Father are one\\\" (v. 30) is the claim that these two promises converge in a single person. The Father's hand and the Son's hand are one protective custody because the Father and the Son are one in purpose, authority, and action. This does not erase the distinction between Father and Son (the Son is sent, the Son obeys, the Son does the Father's will) but declares their operational unity in the work of shepherding.\\n\\n4. **The \\\"no one will snatch them\\\" promise (vv. 28-29) addresses external threats, not the sheep's own capacity to depart.** The language of \\\"snatching\\\" (harpazo) comes from the wolf's predatory action in verse 12 and from the thieves and robbers of verses 1 and 10. No external force -- no wolf, no thief, no hostile authority -- can forcibly remove the sheep from the shepherd's protective hand. The document has already shown that followers can voluntarily depart (6:66, \\\"many of his disciples withdrew and were not walking with him anymore\\\"), and this chapter's own imagery depends on the sheep's voluntary activity of hearing and following (vv. 4-5, 27). The promise protects against predation; it does not eliminate the sheep's own agency. The Ezekiel 34 background itself includes judgment between sheep within the flock (34:17-22), indicating that not all within the flock remain faithful.\\n\\n5. **The present-tense grammar of believing, hearing, and following continues the pattern established throughout the document.** In verse 27, \\\"my sheep hear\\\" (akouousin, present), \\\"I know them\\\" (ginosko, present), \\\"they follow\\\" (akolouthousin, present). In verse 28, \\\"I give them\\\" (didomi, present) eternal life. The sheep are defined by their ongoing activity, not by a past-tense credential. This matches \\\"the one believing\\\" (ho pisteuon, 3:16, 36; 6:35, 40, 47), \\\"the one coming\\\" (ho erchomenos, 6:35), \\\"the one eating\\\" (ho trogon, 6:54, 56-58). The promises attach to persons in the continuous state of hearing, following, and believing. The chapter does not describe a category of persons who heard once, followed once, and are now guaranteed safety regardless of their ongoing relationship to the shepherd. It describes persons whose identity is constituted by their current posture of responsiveness to the shepherd's voice.\\n\\n6. **The Psalm 82 argument (vv. 34-36) is a qal va-homer from within the opponents' own scriptures.** If scripture calls human judges \\\"gods\\\" because they received God's word and exercised God's delegated authority, then the one whom the Father uniquely consecrated and sent into the world has a stronger claim to the title \\\"Son of God\\\" than those judges had to the title \\\"gods.\\\" The argument does not retreat from the \\\"I and the Father are one\\\" claim but establishes that the claim is consistent with scriptural precedent and should be evaluated by the evidence of the works, not dismissed reflexively as blasphemy.\\n\\n7. **The Feast of Dedication (Hanukkah) provides the theological backdrop for the second half of the chapter.** The festival celebrates the consecration of the temple; Jesus claims to be the one the Father has consecrated (v. 36, hegiasen). The temple was the place of God's dwelling; Jesus is the one in whom the Father dwells (\\\"the Father is in me, and I in the Father,\\\" v. 38; \\\"the Word became flesh and tabernacled among us,\\\" 1:14). The festival celebrates the overthrow of illegitimate rulers who profaned God's house; the shepherd discourse has just declared that Israel's current leaders are thieves and hired hands who exploit the flock. The convergence of the festival's themes and Jesus's claims is deliberate: the true dedication is not a building but a person, and the true restoration of Israel is not a military victory over Seleucids but the arrival of the shepherd God promised through Ezekiel.\\n\\n8. **The \\\"other sheep\\\" of verse 16 extends the scope of Jesus's mission beyond Israel to the Gentile nations.** The promise of \\\"one flock, one shepherd\\\" fulfills Ezekiel 37:24 and anticipates the document's later statements about gathering \\\"the children of God who are scattered abroad\\\" (11:52) and drawing \\\"all people\\\" to himself through his lifting up (12:32). The shepherd's death is not only for \\\"this fold\\\" (Israel) but for the other sheep as well. The scope of the good shepherd's sacrifice is universal, consistent with the Samaritans' confession (\\\"the Savior of the world,\\\" 4:42) and the prologue's declaration (\\\"the true light which, coming into the world, enlightens every man,\\\" 1:9).\\n\\n9. **The chapter's argument about Jesus's death as voluntary and commanded culminates in verses 17-18.** The shepherd does not die because he is overpowered but because he chooses to lay down his life. No one takes it; he places it down. He has authority to lay it down and authority to take it up again. This authority comes from the Father's commandment. The death is simultaneously Jesus's free act and the Father's plan. This establishes the interpretive framework for the passion narrative: when Jesus is arrested, tried, and crucified, the reader knows that none of these events escape Jesus's own initiative and authority. The cross is the shepherd's deliberate self-placement between the wolf and the sheep.\\n\\n10. **The geographic return to the Jordan (vv. 40-42) creates an inclusio with the beginning of the document.** The ministry that began with John's testimony at the Jordan reaches a resting point at the same location. The crowd's observation -- \\\"everything John said about this man was true\\\" -- validates the entire testimony arc of the document. John testified to the Lamb of God, the Spirit-bearer, the Son of God. The intervening narrative has demonstrated each of these identities through signs, discourses, and confrontations. The return to the beginning is also a preparation for the end: from the Jordan, the narrative will move to Bethany, to the raising of Lazarus, to the final Passover, and to the death that the good shepherd has been announcing throughout this chapter. The shepherd who has declared his authority to lay down his life and take it up again is about to exercise that authority.\\n\\n11. **The chapter completes the confrontation between Jesus and the religious authorities that has been building since chapter 5.** The healing at Bethesda (ch. 5) produced the charge of Sabbath-breaking and the intention to kill. The bread-of-life discourse (ch. 6) produced grumbling and mass departure. The Tabernacles confrontation (chs. 7-8) produced attempted stonings and the accusation of demonic possession. The healing of the man born blind (ch. 9) produced expulsion from the synagogue. Now, in chapter 10, Jesus gathers all of this into a single image: the religious leaders are not shepherds but thieves, and the sheep do not recognize their voice. The confrontation will not be resolved by argument but by the events that follow -- the raising of Lazarus (ch. 11), which will trigger the decision to kill Jesus (11:47-53), and the passion narrative (chs. 18-19), where the shepherd will lay down his life as he has promised.\"}");

const CAT_ORDER = ['STRONG_CONDITIONAL','LEANS_CONDITIONAL','NOT_APPLICABLE','LEANS_PERMANENT','STRONG_PERMANENT','MISAPPLIED'];
const CAT_CSS = {
  STRONG_CONDITIONAL: 'strong-cond',
  LEANS_CONDITIONAL: 'leans-cond',
  MISAPPLIED: 'misapplied',
  NOT_APPLICABLE: 'na',
  LEANS_PERMANENT: 'leans-perm',
  STRONG_PERMANENT: 'strong-perm'
};
const CAT_PILL_CSS = {
  STRONG_CONDITIONAL: 'sc',
  LEANS_CONDITIONAL: 'lc',
  NOT_APPLICABLE: 'na',
  LEANS_PERMANENT: 'lp',
  STRONG_PERMANENT: 'sp',
  MISAPPLIED: 'ma'
};
const CAT_ABBR = {
  STRONG_CONDITIONAL: 'SC',
  LEANS_CONDITIONAL: 'LC',
  NOT_APPLICABLE: 'NA',
  LEANS_PERMANENT: 'LP',
  STRONG_PERMANENT: 'SP',
  MISAPPLIED: 'MA'
};
const CAT_LABELS = {
  STRONG_CONDITIONAL: 'Strong Conditional',
  LEANS_CONDITIONAL: 'Leans Conditional',
  MISAPPLIED: 'Misapplied',
  NOT_APPLICABLE: 'Not Applicable',
  LEANS_PERMANENT: 'Leans Permanent',
  STRONG_PERMANENT: 'Strong Permanent'
};
const CAT_WEIGHT = {
  STRONG_CONDITIONAL: -2,
  LEANS_CONDITIONAL: -1,
  NOT_APPLICABLE: 0,
  LEANS_PERMANENT: 1,
  STRONG_PERMANENT: 2,
  MISAPPLIED: 0
};
const CONV_LABELS = {
  cited_for_permanence: 'Conventionally cited for permanence',
  cited_for_conditionality: 'Conventionally cited for conditionality',
  cited_by_both: 'Cited by both sides',
  not_in_debate: 'Not typically in debate'
};

function countCats(data) {
  const counts = {};
  CAT_ORDER.forEach(c => counts[c] = 0);
  data.forEach(ch => ch.sections.forEach(s => {
    counts[s.category] = (counts[s.category] || 0) + 1;
  }));
  return counts;
}

function chapterCounts(ch) {
  const counts = {};
  CAT_ORDER.forEach(c => counts[c] = 0);
  ch.sections.forEach(s => {
    counts[s.category] = (counts[s.category] || 0) + 1;
  });
  return counts;
}

const totalSections = DATA.reduce((n, ch) => n + ch.sections.length, 0);
const globalCounts = countCats(DATA);

function computeWeighted(counts) {
  let score = 0;
  CAT_ORDER.forEach(c => { score += (counts[c] || 0) * CAT_WEIGHT[c]; });
  return score;
}

function computeMaxRange(counts) {
  let total = 0;
  CAT_ORDER.forEach(c => { if (c !== 'NOT_APPLICABLE' && c !== 'MISAPPLIED') total += counts[c] || 0; });
  return total * 2;
}

function renderSummaryBar(counts) {
  return CAT_ORDER
    .map(c => {
      const n = counts[c] || 0;
      if (n === 0) return `<div class="seg" style="flex:0.3;background:var(--cat-${CAT_CSS[c]});opacity:0.15"></div>`;
      return `<div class="seg" style="flex:${n};background:var(--cat-${CAT_CSS[c]})"></div>`;
    }).join('');
}

function renderPills(counts) {
  return CAT_ORDER
    .map(c => {
      const n = counts[c] || 0;
      const zero = n === 0 ? ' ch-pill-zero' : '';
      return `<span class="ch-pill ch-pill-${CAT_PILL_CSS[c]}${zero}" title="${CAT_LABELS[c]}">${n} ${CAT_ABBR[c]}</span>`;
    }).join('');
}

function renderSection(s, book) {
  if (s.category === 'NOT_APPLICABLE') {
    return `<div class="na-row">
      <span class="ref">${book} ${s.reference}</span>
      <span class="cat-badge cat-NOT_APPLICABLE">N/A</span>
      <span class="section-summary">${esc(s.section_title)}</span>
    </div>`;
  }
  const convHtml = s.conventional_use && CONV_LABELS[s.conventional_use]
    ? `<span class="conv-use">${CONV_LABELS[s.conventional_use]}</span>` : '';
  const confHtml = s.confidence
    ? `<span class="confidence-tag">${s.confidence} conf.</span>` : '';
  const relHtml = s.relevance
    ? `<div class="section-relevance">${esc(s.relevance)}</div>` : '';
  const kpHtml = s.key_phrases && s.key_phrases.length
    ? `<div class="key-phrases">${s.key_phrases.map(p => `<span class="kp">${esc(p)}</span>`).join('')}</div>` : '';

  return `<div class="section-row">
    <div class="section-top">
      <span class="ref">${book} ${s.reference}</span>
      <span class="cat-badge cat-${s.category}">${CAT_LABELS[s.category]}</span>
      ${confHtml}
      ${convHtml}
    </div>
    <div class="section-title-text">${esc(s.section_title)}</div>
    <div class="section-summary">${esc(s.summary)}</div>
    ${relHtml}
    ${kpHtml}
  </div>`;
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\u2019/g, '&rsquo;').replace(/\u201C/g, '&ldquo;').replace(/\u201D/g, '&rdquo;')
    .replace(/\u2014/g, '&mdash;');
}

function pass1Key(book, chapter) {
  return book.replace(/\s/g, '') + '_' + String(chapter).padStart(2, '0');
}

function mdToHtml(md) {
  const lines = md.split('\n');
  let html = '';
  let inOl = false;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '') {
      if (inOl) { html += '</ol>'; inOl = false; }
      i++;
      continue;
    }
    if (/^---+\s*$/.test(line.trim())) {
      if (inOl) { html += '</ol>'; inOl = false; }
      html += '<hr>';
      i++;
      continue;
    }
    const hMatch = line.match(/^(#{1,3})\s+(.+)/);
    if (hMatch) {
      if (inOl) { html += '</ol>'; inOl = false; }
      const level = hMatch[1].length;
      html += '<h' + level + '>' + inlineFmt(hMatch[2]) + '</h' + level + '>';
      i++;
      continue;
    }
    const olMatch = line.match(/^(\d+)\.\s+(.+)/);
    if (olMatch) {
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + inlineFmt(olMatch[2]) + '</li>';
      i++;
      continue;
    }
    if (inOl) { html += '</ol>'; inOl = false; }
    let para = line;
    while (i + 1 < lines.length && lines[i + 1].trim() !== '' && !lines[i + 1].match(/^#{1,3}\s/) && !lines[i + 1].match(/^---/) && !lines[i + 1].match(/^\d+\.\s/)) {
      i++;
      para += ' ' + lines[i];
    }
    html += '<p>' + inlineFmt(para) + '</p>';
    i++;
  }
  if (inOl) html += '</ol>';
  return html;
}

function inlineFmt(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  return s;
}

function showPass1(book, chapter) {
  const key = pass1Key(book, chapter);
  const md = PASS1[key];
  if (!md) return;
  document.getElementById('pass1Title').textContent = book + ' ' + chapter + ' — Neutral Reading';
  document.getElementById('pass1Body').innerHTML = mdToHtml(md);
  document.getElementById('pass1Modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closePass1() {
  document.getElementById('pass1Modal').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePass1();
});

const weightedScore = computeWeighted(globalCounts);
const maxRange = computeMaxRange(globalCounts);
const condScore = (globalCounts.STRONG_CONDITIONAL * 2) + (globalCounts.LEANS_CONDITIONAL * 1);
const permScore = (globalCounts.STRONG_PERMANENT * 2) + (globalCounts.LEANS_PERMANENT * 1);

const maForPerm = DATA.flatMap(ch => ch.sections).filter(s => s.category === 'MISAPPLIED' && s.conventional_use === 'cited_for_permanence').length;
const maForCond = DATA.flatMap(ch => ch.sections).filter(s => s.category === 'MISAPPLIED' && s.conventional_use === 'cited_for_conditionality').length;

const gaugeMin = -maxRange || -1;
const gaugeMax = maxRange || 1;
const gaugePct = maxRange > 0 ? ((weightedScore - gaugeMin) / (gaugeMax - gaugeMin)) * 100 : 50;
const fillLeft = Math.min(gaugePct, 50);
const fillRight = Math.max(gaugePct, 50);
const fillColor = weightedScore < 0 ? 'var(--cat-strong-cond)' : weightedScore > 0 ? 'var(--cat-leans-perm)' : 'var(--cat-na)';

let html = `
<div class="page-header">
  <h1>Pass 2 Test Report</h1>
  <p class="subtitle">OSAS assessment of ${DATA.length} test chapters &middot; ${totalSections} passage-level sections</p>
  <div class="summary-bar">${renderSummaryBar(globalCounts)}</div>
  <div class="legend">
    ${CAT_ORDER.map(c =>
      `<span class="legend-item"><span class="legend-dot" style="background:var(--cat-${CAT_CSS[c]})"></span>${CAT_LABELS[c]} (${globalCounts[c]})</span>`
    ).join('')}
  </div>
</div>

<div class="overall">
  <h3>Overall Assessment</h3>
  <div class="score-row">
    <div>
      <div class="score-number" style="color:${fillColor}">${weightedScore > 0 ? '+' : ''}${weightedScore}</div>
      <div class="score-label">Weighted score<br>(Strong &times;2, Leans &times;1)</div>
    </div>
    <div class="score-breakdown">
      <div class="neg">Conditional: ${globalCounts.STRONG_CONDITIONAL} strong (&times;2) + ${globalCounts.LEANS_CONDITIONAL} leans (&times;1) = &minus;${condScore}</div>
      <div class="pos">Permanent: ${globalCounts.STRONG_PERMANENT} strong (&times;2) + ${globalCounts.LEANS_PERMANENT} leans (&times;1) = +${permScore}</div>
      <div>Not Applicable: ${globalCounts.NOT_APPLICABLE} (not scored)</div>
      <div class="neut">Misapplied: ${globalCounts.MISAPPLIED} (not scored)</div>
    </div>
  </div>
  <div class="gauge-track">
    <div class="gauge-center"></div>
    <div class="gauge-fill" style="left:${fillLeft}%;right:${100-fillRight}%;background:${fillColor}"></div>
  </div>
  <div class="gauge-labels">
    <span>Conditional</span>
    <span>Neutral</span>
    <span>Permanent</span>
  </div>
  ${globalCounts.MISAPPLIED > 0 ? `<div class="ma-note">
    <strong>${globalCounts.MISAPPLIED} Misapplied</strong> passages removed from scoring:
    ${maForPerm > 0 ? `${maForPerm} conventionally cited for permanence` : ''}${maForPerm > 0 && maForCond > 0 ? ', ' : ''}${maForCond > 0 ? `${maForCond} conventionally cited for conditionality` : ''}
    &mdash; the neutral reading shows these passages address something other than what they are conventionally cited for.
  </div>` : ''}
</div>

<div class="stats-row">
  ${CAT_ORDER.map(c =>
    `<div class="stat-card stat-card-${CAT_PILL_CSS[c]}"><div class="stat-n">${globalCounts[c]}</div><div class="stat-label">${CAT_LABELS[c]}</div></div>`
  ).join('')}
</div>
`;

DATA.forEach((ch, i) => {
  const cc = chapterCounts(ch);
  const label = `${ch.book} ${ch.chapter}`;
  const openClass = i === 0 ? ' open' : '';
  html += `<div class="chapter-card${openClass}" data-ch="${i}">
    <div class="chapter-header" onclick="this.parentElement.classList.toggle('open')">
      <h2>${label}</h2>
      <span class="pass1-link" onclick="event.stopPropagation();showPass1('${ch.book}',${ch.chapter})">Pass&nbsp;1</span>
      <div class="ch-summary">${renderPills(cc)}</div>
      <span class="toggle-icon">&#9654;</span>
    </div>
    <div class="chapter-body">
      ${ch.sections.map(s => renderSection(s, ch.book === '1 John' ? '1 Jn' : ch.book === 'John' ? 'Jn' : ch.book.substring(0,3))).join('')}
    </div>
  </div>`;
});

html += `<div class="report-footer">Pass 2 prompt: assessment_pass2.md &middot; Model: opus &middot; ${DATA.length} of 260 chapters</div>`;

document.getElementById('app').innerHTML = html;
</script>
</body>
</html>
