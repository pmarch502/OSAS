<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass 2 Test Report — OSAS Assessment</title>
<style>
  :root {
    --bg: #F6F4EF;
    --bg-card: #FFFFFF;
    --bg-card-alt: #F0EDE6;
    --text: #2A2A2E;
    --text-muted: #6B6660;
    --text-faint: #9B9590;
    --border: #DDD8CF;
    --border-light: #E8E4DC;

    --cat-strong-cond: #A63D2F;
    --cat-strong-cond-bg: #A63D2F18;
    --cat-leans-cond: #B8762A;
    --cat-leans-cond-bg: #B8762A15;
    --cat-na: #7B8794;
    --cat-na-bg: #7B879412;
    --cat-leans-perm: #3D8B7A;
    --cat-leans-perm-bg: #3D8B7A15;
    --cat-strong-perm: #1B7AB5;
    --cat-strong-perm-bg: #1B7AB518;
    --cat-misapplied: #7E6A9B;
    --cat-misapplied-bg: #7E6A9B15;

    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1E;
      --bg-card: #242428;
      --bg-card-alt: #2A2A2F;
      --text: #E2DFD8;
      --text-muted: #9B9590;
      --text-faint: #6B6660;
      --border: #3A3A3F;
      --border-light: #32323A;

      --cat-strong-cond: #D4675A;
      --cat-strong-cond-bg: #D4675A20;
      --cat-leans-cond: #D4A04A;
      --cat-leans-cond-bg: #D4A04A18;
      --cat-na: #8A95A2;
      --cat-na-bg: #8A95A218;
      --cat-leans-perm: #5AAF9D;
      --cat-leans-perm-bg: #5AAF9D18;
      --cat-strong-perm: #4AA8D4;
      --cat-strong-perm-bg: #4AA8D418;
      --cat-misapplied: #A68CC4;
      --cat-misapplied-bg: #A68CC420;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1A1E;
    --bg-card: #242428;
    --bg-card-alt: #2A2A2F;
    --text: #E2DFD8;
    --text-muted: #9B9590;
    --text-faint: #6B6660;
    --border: #3A3A3F;
    --border-light: #32323A;
    --cat-strong-cond: #D4675A;
    --cat-strong-cond-bg: #D4675A20;
    --cat-leans-cond: #D4A04A;
    --cat-leans-cond-bg: #D4A04A18;
    --cat-na: #8A95A2;
    --cat-na-bg: #8A95A218;
    --cat-leans-perm: #5AAF9D;
    --cat-leans-perm-bg: #5AAF9D18;
    --cat-strong-perm: #4AA8D4;
    --cat-strong-perm-bg: #4AA8D418;
    --cat-misapplied: #A68CC4;
    --cat-misapplied-bg: #A68CC420;
  }
  :root[data-theme="light"] {
    --bg: #F6F4EF;
    --bg-card: #FFFFFF;
    --bg-card-alt: #F0EDE6;
    --text: #2A2A2E;
    --text-muted: #6B6660;
    --text-faint: #9B9590;
    --border: #DDD8CF;
    --border-light: #E8E4DC;
    --cat-strong-cond: #A63D2F;
    --cat-strong-cond-bg: #A63D2F18;
    --cat-leans-cond: #B8762A;
    --cat-leans-cond-bg: #B8762A15;
    --cat-na: #7B8794;
    --cat-na-bg: #7B879412;
    --cat-leans-perm: #3D8B7A;
    --cat-leans-perm-bg: #3D8B7A15;
    --cat-strong-perm: #1B7AB5;
    --cat-strong-perm-bg: #1B7AB518;
    --cat-misapplied: #7E6A9B;
    --cat-misapplied-bg: #7E6A9B15;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .page-header {
    margin-bottom: 40px;
  }

  .page-header h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  /* --- Summary bar --- */
  .summary-bar {
    display: flex;
    gap: 2px;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .summary-bar .seg {
    transition: flex 0.3s;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* --- Stats row --- */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
  }
  .stat-card {
    border-radius: 8px;
    padding: 14px 16px;
    text-align: center;
    border: 1px solid var(--border-light);
  }
  .stat-card-sc { background: #D4675A80; }
  .stat-card-lc { background: #D4A04A80; }
  .stat-card-na { background: #9BA5B080; }
  .stat-card-lp { background: #5AAF9D80; }
  .stat-card-sp { background: #3B8EC280; }
  .stat-card-ma { background: #A68CC480; }
  .stat-card .stat-n {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 3px;
    color: var(--text);
  }
  .stat-card .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  /* --- Chapter card --- */
  .chapter-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .chapter-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    user-select: none;
  }
  .chapter-header:hover { background: var(--bg-card-alt); }
  .chapter-header h2 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    flex: 1;
  }
  .chapter-header .ch-summary {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }
  .ch-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    min-width: 38px;
    text-align: center;
  }
  .ch-pill-sc { background: #D4675A; color: #1a1a1a; }
  .ch-pill-lc { background: #D4A04A; color: #1a1a1a; }
  .ch-pill-na { background: #9BA5B0; color: #1a1a1a; }
  .ch-pill-lp { background: #5AAF9D; color: #1a1a1a; }
  .ch-pill-sp { background: #3B8EC2; color: #1a1a1a; }
  .ch-pill-ma { background: #A68CC4; color: #1a1a1a; }
  .ch-pill-zero { opacity: 0.35; }
  .chapter-header .toggle-icon {
    font-size: 12px;
    color: var(--text-faint);
    transition: transform 0.2s;
    flex-shrink: 0;
    align-self: center;
  }
  .chapter-card.open .toggle-icon { transform: rotate(90deg); }

  .chapter-body {
    display: none;
  }
  .chapter-card.open .chapter-body { display: block; }

  /* --- Section row --- */
  .section-row {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-light);
  }
  .section-row:last-child { border-bottom: none; }

  .section-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .ref {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .cat-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .cat-STRONG_CONDITIONAL  { color: var(--cat-strong-cond); background: var(--cat-strong-cond-bg); }
  .cat-LEANS_CONDITIONAL   { color: var(--cat-leans-cond);  background: var(--cat-leans-cond-bg); }
  .cat-NOT_APPLICABLE      { color: var(--cat-na);          background: var(--cat-na-bg); }
  .cat-LEANS_PERMANENT     { color: var(--cat-leans-perm);  background: var(--cat-leans-perm-bg); }
  .cat-STRONG_PERMANENT    { color: var(--cat-strong-perm); background: var(--cat-strong-perm-bg); }
  .cat-MISAPPLIED          { color: var(--cat-misapplied);  background: var(--cat-misapplied-bg); }

  .section-title-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .conv-use {
    font-size: 11px;
    color: var(--text-faint);
    font-style: italic;
    margin-left: auto;
    white-space: nowrap;
  }

  .confidence-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    white-space: nowrap;
  }

  .section-summary {
    font-size: 14px;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 6px;
  }

  .section-relevance {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-light);
  }

  .key-phrases {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .kp {
    font-size: 12px;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
    background: var(--bg-card-alt);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
  }

  .na-row {
    padding: 10px 22px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .na-row:last-child { border-bottom: none; }
  .na-row .section-summary {
    margin-bottom: 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* --- Overall summary --- */
  .overall {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 32px;
  }
  .overall h3 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .score-number {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .score-label {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .score-breakdown {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    font-family: var(--font-mono);
  }
  .score-breakdown .pos { color: var(--cat-leans-perm); }
  .score-breakdown .neg { color: var(--cat-strong-cond); }
  .score-breakdown .neut { color: var(--cat-misapplied); }

  .gauge-track {
    width: 100%;
    height: 24px;
    background: var(--bg-card-alt);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .gauge-center {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--text-faint);
    transform: translateX(-1px);
  }
  .gauge-fill {
    position: absolute;
    top: 3px;
    bottom: 3px;
    border-radius: 9px;
    transition: all 0.4s ease;
  }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .ma-note {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--cat-misapplied-bg);
    border-left: 3px solid var(--cat-misapplied);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* --- Footer --- */
  .report-footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-content {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 780px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
  }
  .modal-header h3 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .modal-close:hover {
    background: var(--bg-card-alt);
    color: var(--text);
  }
  .modal-body {
    overflow-y: auto;
    padding: 24px;
    line-height: 1.7;
    font-size: 14px;
  }
  .modal-body h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 32px 0 12px; line-height: 1.3; }
  .modal-body h1:first-child { margin-top: 0; }
  .modal-body h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 28px 0 10px; line-height: 1.3; }
  .modal-body h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 20px 0 8px; }
  .modal-body p { margin: 0 0 12px; color: var(--text); }
  .modal-body strong { font-weight: 700; }
  .modal-body em { font-style: italic; }
  .modal-body hr { border: none; border-top: 1px solid var(--border-light); margin: 24px 0; }
  .modal-body blockquote {
    border-left: 3px solid var(--border);
    padding-left: 16px;
    margin: 12px 0;
    color: var(--text-muted);
  }
  .modal-body ol { margin: 0 0 12px; padding-left: 24px; }
  .modal-body ol li { margin-bottom: 6px; }
  .pass1-link {
    font-size: 11px;
    color: var(--text-faint);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 2px;
    white-space: nowrap;
    align-self: center;
  }
  .pass1-link:hover { color: var(--text-muted); }

  @media (max-width: 600px) {
    .page { padding: 24px 14px 60px; }
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .chapter-header { padding: 14px 16px 10px; }
    .section-row, .na-row { padding: 12px 16px; }
    .section-top { gap: 6px; }
    .conv-use { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<div id="pass1Modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePass1()">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="pass1Title"></h3>
      <button class="modal-close" onclick="closePass1()">&times;</button>
    </div>
    <div class="modal-body" id="pass1Body"></div>
  </div>
</div>

const DATA = [
  {
    "book": "Romans", "chapter": 8,
    "sections": [
      {"reference":"8:1-4","section_title":"No Condemnation, and What God Did Through His Son","category":"LEANS_PERMANENT","conventional_use":"cited_for_permanence","summary":"God resolved the chapter 7 crisis by condemning sin in the flesh through Christ's sacrifice, removing condemnation for those in Christ Jesus and enabling the Spirit-empowered fulfillment of the law's righteous requirement.","relevance":"The absolute 'no condemnation' (ouden katakrima) for those in Christ declares the present standing of believers as a completed judicial act — the sentence has been redirected from the sinner to sin itself. The neutral reading treats Spirit-walking as descriptive of those in Christ rather than conditional for their no-condemnation status, which leans toward permanence. However, the passage addresses the current verdict without directly arguing whether 'in Christ' standing is irrevocable or whether one could exit that sphere.","key_phrases":["no condemnation for those who are in Christ Jesus","the law of the Spirit of life has set you free","God condemned sin in the flesh","the righteous requirement of the law might be fulfilled in us","who walk not according to the flesh but according to the Spirit"],"confidence":"medium"},
      {"reference":"8:5-11","section_title":"The Two Modes of Existence — Flesh and Spirit","category":"LEANS_PERMANENT","conventional_use":"cited_for_permanence","summary":"Paul describes two mutually exclusive modes of existence — flesh and Spirit — establishing that believers are in the Spirit, with the Spirit's indwelling constituting belonging to Christ and guaranteeing future bodily resurrection.","relevance":"The Spirit's indwelling is identified as the defining marker of belonging to Christ — 'anyone who does not have the Spirit of Christ does not belong to him' (v. 9) — and the same indwelling Spirit guarantees future bodily resurrection (v. 11). These claims imply security: if you have the Spirit, you belong to Christ and will be raised. However, the passage describes the believers' current location ('you are not in the flesh but in the Spirit') without explicitly addressing whether the Spirit's indwelling is irrevocable or whether one could return to 'in the flesh' status.","key_phrases":["the mind set on the flesh is death","the mind set on the Spirit is life and peace","you are not in the flesh but in the Spirit","anyone who does not have the Spirit of Christ does not belong to him","will also give life to your mortal bodies through his Spirit who dwells in you"],"confidence":"medium"},
      {"reference":"8:12-17","section_title":"Obligation, Sonship, and Inheritance","category":"STRONG_CONDITIONAL","conventional_use":"cited_by_both","summary":"Paul draws practical conclusions from the theological exposition: believers are obligated to the Spirit, directly warned that flesh-living leads to death, identified as Spirit-led sons of God, and established as heirs with Christ — provided they share in his suffering.","relevance":"Verse 13 directly warns believers that living according to the flesh leads to death. The neutral reading is explicit: Paul 'is not speaking hypothetically about outsiders; he is warning the believers themselves that a return to flesh-governed existence leads to death.' The present tense of both 'live' (zete) and 'put to death' (thanatoute) indicates ongoing activity, not a one-time event — the believers must continually put to death the body's deeds by the Spirit. The neutral reading further notes that 'the indicative (you have been freed) does not eliminate the imperative (you must live accordingly), and the failure to live accordingly has real consequences (death).' Verse 17's co-glorification is conditioned on co-suffering (eiper sympaschomen), which the neutral reading calls 'a condition that Paul treats as true of his audience but that remains a genuine condition nonetheless.'","key_phrases":["if you live according to the flesh you will die","if by the Spirit you put to death the deeds of the body, you will live","we are debtors, not to the flesh","provided we suffer with him in order that we may also be glorified with him"],"confidence":"high"},
      {"reference":"8:18-25","section_title":"Present Suffering and Future Glory — Creation's Groaning","category":"NOT_APPLICABLE","summary":"Paul compares present suffering with future glory across individual, communal, and cosmic scales — describing creation's groaning in birth pangs, believers' groaning for bodily redemption as those who have the Spirit's firstfruits, and the already/not yet structure of salvation in hope that requires patient endurance."},
      {"reference":"8:26-27","section_title":"The Spirit's Intercession","category":"NOT_APPLICABLE","summary":"The Spirit assists believers in their weakness by interceding with inarticulate groanings that are perfectly aligned with God's will, addressing the believers' inability to know what to pray for during the tension between the already and the not yet."},
      {"reference":"8:28-30","section_title":"God's Purpose and the Chain of Divine Acts","category":"MISAPPLIED","conventional_use":"cited_for_permanence","summary":"Paul grounds the believers' confidence in God's purpose through a chain of divine acts — foreknowing, predestining, calling, justifying, glorifying — aimed at conforming a people to the image of Christ as firstborn among many brothers.","relevance":"Conventionally cited as the 'golden chain' proving that each predestined individual will certainly be glorified, establishing individual permanent security. The neutral reading reveals the passage is about God's corporate purpose for a people: 'foreknew' (proegno) carries relational and corporate force — Paul's only other use in Romans (11:2) refers to Israel as a corporate entity God 'foreknew,' and the LXX background of yada denotes covenantal relationship, not cognitive foresight of individual decisions. The goal of predestination is 'that he might be the firstborn among many brothers' — the creation of a family conformed to Christ's image, a corporate and purposive destination. The neutral reading explicitly notes this chain 'does not nullify the imperatives that Paul has issued throughout chapters 6-8' and that 'God acts; the believer must also act. God's purpose is certain; the believer's obedience is required.' The chain describes God's purpose for a people without addressing whether individuals can exit that people.","key_phrases":["those whom he foreknew he also predestined","conformed to the image of his Son","firstborn among many brothers","those whom he justified he also glorified","called according to his purpose","those who love God"],"confidence":"medium"},
      {"reference":"8:31-39","section_title":"The Rhetorical Climax — What Shall We Say to These Things?","category":"MISAPPLIED","conventional_use":"cited_for_permanence","summary":"Paul's rhetorical climax declares that no external force — death, life, angels, rulers, things present or future, powers, height, depth, or any created thing — can separate believers from the love of God in Christ Jesus.","relevance":"Conventionally cited as proof that nothing whatsoever can separate believers from God's love, therefore believers can never lose their salvation. The neutral reading reveals the passage specifically addresses external threats and cosmic powers, not the believer's own agency. The neutral reading is explicit: 'the list of things that cannot separate consists entirely of external forces, circumstances, and cosmic powers. Paul does not include in this list the believer's own choices, the believer's own apostasy, the believer's own decision to abandon the faith, or the believer's own return to living according to the flesh.' The question Paul answers is 'Can the hostile universe overcome God's love for his people?' — not 'Can anything at all, including the believer's own apostasy, sever the relationship?' The vivid summary: 'The passage assures that the enemies outside the walls cannot breach the city; it does not address the question of whether the inhabitants might open the gates from within.'","key_phrases":["If God is for us, who can be against us?","who shall separate us from the love of Christ?","neither death nor life, nor angels nor rulers","nor anything else in all creation","we are more than conquerors through him who loved us","the love of God in Christ Jesus our Lord"],"confidence":"high"}

    "book": "Hebrews", "chapter": 10,
    "sections": [
      {"reference":"10:1-4","section_title":"The Shadow's Inability to Perfect","category":"NOT_APPLICABLE","summary":"The Law's sacrificial system, possessing only a shadow of the coming good things, can never perfect those who approach, as demonstrated by the need for continual repetition and the categorical impossibility of animal blood removing sin."},
      {"reference":"10:5-7","section_title":"The Psalm 40 Quotation","category":"NOT_APPLICABLE","summary":"The author reads Psalm 40 (LXX) as Christ's own words at the incarnation, declaring that God did not desire animal sacrifice but prepared a body for the Son to do God's will."},
      {"reference":"10:8-10","section_title":"Taking Away the First to Establish the Second","category":"LEANS_PERMANENT","conventional_use":"cited_for_permanence","summary":"The author interprets the Psalm 40 quotation as God removing the old sacrificial system to establish the new, concluding that believers have been sanctified through the once-for-all offering of Christ's body.","relevance":"The once-for-all sanctification language and the perfect passive participle ('have been sanctified') describe a completed action with ongoing results, implying a permanent accomplishment by Christ's sacrifice. However, the neutral reading frames this primarily as describing the nature of the sacrifice (unrepeatable, definitive) rather than as a direct statement about whether individual standing is unconditionally permanent. The passage establishes what the sacrifice accomplished objectively; later passages (especially 10:29, where 'he was sanctified' describes a genuine apostate) show the author does not treat this accomplished sanctification as automatically preventing departure.","key_phrases":["we have been sanctified","once for all","through the offering of the body of Jesus Christ","He takes away the first in order to establish the second"],"confidence":"medium"},
      {"reference":"10:11-14","section_title":"The Standing Priest and the Seated Priest","category":"LEANS_PERMANENT","conventional_use":"cited_for_permanence","summary":"The author contrasts the standing Levitical priest, whose repeated sacrifices can never take away sins, with the seated Christ, whose single offering perfected for all time those who are being sanctified.","relevance":"The 'perfected for all time' language (perfect tense) is the chapter's strongest permanence statement, describing a completed, irreversible achievement of Christ's sacrifice. Yet the neutral reading identifies a deliberate grammatical tension with 'being sanctified' (present tense), distinguishing between what the sacrifice accomplished objectively (permanent perfecting of access to God) and the people's ongoing experience (continuing sanctification). The neutral reading explicitly states: 'The sacrifice cannot fail; but the person can leave.' The permanence applies to the sacrifice's achievement, not necessarily to the individual's unconditional retention of standing.","key_phrases":["perfected for all time","those who are being sanctified","one sacrifice for sins for all time","sat down at the right hand of God"],"confidence":"medium"},
      {"reference":"10:15-18","section_title":"The Holy Spirit's Testimony — The Conclusion from Jeremiah","category":"LEANS_PERMANENT","conventional_use":"not_in_debate","summary":"The author cites the Holy Spirit's testimony through Jeremiah 31, extracting the new covenant promises of internalized law and complete forgiveness of sins, and concludes that where forgiveness exists no further sin offering is needed.","relevance":"The 'sins and lawless deeds I will remember no more' language and the conclusion that no further offering remains establish the definitive, complete nature of new covenant forgiveness, which has implications for permanence. However, the neutral reading frames this as the capstone of the argument about the sacrificial system's obsolescence — the sin offering has exhausted its function — rather than as a direct statement about whether individual standing is unconditionally permanent.","key_phrases":["their sins and their lawless deeds I will remember no more","no longer any offering for sin"],"confidence":"low"},
      {"reference":"10:19-21","section_title":"Confidence to Enter the Holy Place","category":"NOT_APPLICABLE","summary":"The author transitions from doctrine to exhortation, establishing that believers have confident access to enter God's presence through the blood of Jesus by the new and living way Christ inaugurated through his flesh, under the oversight of a great priest over God's house."},
      {"reference":"10:22-25","section_title":"The Three Exhortations","category":"LEANS_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author issues three exhortations — to draw near with sincere hearts, to hold firmly to the confession of hope without wavering, and to stimulate one another to love and good deeds rather than abandoning the community gathering.","relevance":"The exhortation to 'hold firmly without wavering' uses the same verb (katechomen) as the conditional statements in 3:6 and 3:14 ('if we hold firmly'), implying the real possibility of failing to hold. The warning against abandoning the community gathering — connected to the letter's broader pattern of drift (2:1), hardening (3:13), and the falling away of 6:4-6 — implies that the community assembly is structurally necessary to sustain faith.","key_phrases":["hold firmly to the confession of our hope without wavering","not abandoning our own meeting together, as is the habit of some","all the more as you see the Day drawing near"],"confidence":"medium"},
      {"reference":"10:26-27","section_title":"Willful Sin After Knowledge of the Truth","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author warns that for those who go on sinning willfully after receiving the full knowledge of the truth, there no longer remains a sacrifice for sins — only a terrifying expectation of judgment and the fury of a fire that will consume God's adversaries.","relevance":"The passage directly addresses whether a person who has received full knowledge of the truth (an insider, not an outsider) can forfeit their standing. The neutral reading connects the 'willful' sin to the Numbers 15:30-31 distinction between inadvertent and high-handed sin, for which no sacrifice existed even under the Mosaic Law. The logic is identical to 6:4-6: the finality of God's provision means its deliberate rejection exhausts all available remedy. The inclusive 'we' shows the author does not exempt himself or his audience.","key_phrases":["if we go on sinning willfully","after receiving the knowledge of the truth","there no longer remains a sacrifice for sins","terrifying expectation of judgment","fury of a fire which will consume the adversaries"],"confidence":"high"},
      {"reference":"10:28-29","section_title":"The Lesser-to-Greater Argument","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"Using a lesser-to-greater argument from the Torah, the author argues that if setting aside Moses' Law brought death without mercy, far worse punishment awaits the one who tramples the Son of God, treats the covenant blood as common, and insults the Spirit of grace — specifying that this person was genuinely sanctified by that very blood.","relevance":"The clause 'by which he was sanctified' (aorist passive of hagiazo, the same verb used in 10:10 and 10:14) directly establishes that the apostate in view was a genuine participant in the covenant, not a pretender. The three-fold offense (trampling the Son, profaning the blood, insulting the Spirit) covers the full scope of God's saving work.","key_phrases":["how much worse punishment","trampled under foot the Son of God","regarded as unclean the blood of the covenant by which he was sanctified","insulted the Spirit of grace"],"confidence":"high"},
      {"reference":"10:30-31","section_title":"The Scriptural Verdict from Deuteronomy 32","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author grounds the warning in two quotations from the Song of Moses (Deuteronomy 32), asserting that God claims vengeance as his own prerogative, that the Lord will judge his own people, and concluding that it is a terrifying thing to fall into the hands of the living God.","relevance":"The Deuteronomy 32 quotations were originally addressed to covenant Israel — insiders who betrayed the covenant God — and the author applies them to the new covenant community with deliberate precision. 'The people being judged are His people — not outsiders but insiders, not strangers but members of the covenant community.'","key_phrases":["Vengeance is Mine, I will repay","The Lord will judge His people","terrifying thing to fall into the hands of the living God"],"confidence":"high"},
      {"reference":"10:32-34","section_title":"Encouragement from the Audience's Past Endurance","category":"LEANS_CONDITIONAL","conventional_use":"not_in_debate","summary":"The author shifts from warning to encouragement, calling the audience to remember their former endurance under suffering — being made a public spectacle, showing sympathy to prisoners, and accepting the seizure of their property joyfully.","relevance":"The reminder of past endurance presupposes the need for continued endurance rather than guaranteeing the outcome. The 'better and lasting possession' motivates ongoing faithfulness; the neutral reading does not present it as a guarantee that the audience will inevitably receive it.","key_phrases":["remember the former days","after being enlightened, you endured a great conflict of sufferings","a better and lasting possession"],"confidence":"low"},
      {"reference":"10:35-36","section_title":"The Exhortation to Endurance","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author exhorts the audience not to throw away their confidence (which carries a great reward), tells them they have need of endurance, and states that doing the will of God is the condition for receiving what was promised.","relevance":"The passage directly states that confidence CAN be voluntarily thrown away (apobalete — to cast off, to discard), that endurance is NEEDED (not optional or automatic), and that receiving the promise is conditional on doing God's will through endurance. The 'so that' (hina) clause makes the conditionality syntactically explicit.","key_phrases":["do not throw away your confidence","you have need of endurance","so that when you have done the will of God, you may receive what was promised"],"confidence":"high"},
      {"reference":"10:37-38","section_title":"The Habakkuk Quotation — The Righteous One and Faith","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author quotes Habakkuk 2:3-4 (via the LXX, with modifications) to present two paths: the righteous one living by faith, or shrinking back to God's displeasure.","relevance":"The Habakkuk quotation directly presents two possible outcomes for God's own 'righteous one' (ho dikaios mou — possessive, belonging to God): living by faith or shrinking back. The 'if he shrinks back' clause (ean hyposteiletai — subjunctive, a genuinely open condition) presents a real possibility for the person already identified as God's own righteous one.","key_phrases":["My righteous one shall live by faith","if he shrinks back, My soul has no pleasure in him"],"confidence":"high"},
      {"reference":"10:39","section_title":"The Author's Final Declaration","category":"STRONG_CONDITIONAL","conventional_use":"cited_for_conditionality","summary":"The author declares that 'we' are not of those who shrink back to destruction but of those who have faith to the preserving of the soul.","relevance":"The passage directly names two categories and their respective destinations: shrinking back leading to destruction (apoleia) versus faith leading to preservation of the soul. The believer's ultimate destination is contingent on faith versus withdrawal. The neutral reading explicitly states this is 'not a statement of guaranteed outcome but a declaration of present identity and intention.'","key_phrases":["shrink back to destruction","faith to the preserving of the soul","we are not of those who shrink back"],"confidence":"high"}

      {"reference":"2:15-17","section_title":"The Warning Against Loving the World","category":"LEANS_CONDITIONAL","conventional_use":"not_in_debate","summary":"The author warns against loving the world and its desires, declaring that the world is passing away but the one who does God's will abides forever.","relevance":"The passage explicitly connects permanence ('abides forever') to ongoing conduct ('does the will of God'), making enduring standing contingent on faithfulness rather than on a prior decision alone. The prohibition 'do not love the world' is addressed to the believing community using a present imperative that can mean 'stop loving,' implying the audience may already be in danger.","key_phrases":["if anyone loves the world, the love of the Father is not in him","the world is passing away along with its desires","the one who does the will of God abides forever"],"confidence":"medium"},
      {"reference":"2:18-23","section_title":"The Crisis of the Community — False Teachers and the Denial of Christ","category":"LEANS_PERMANENT","conventional_use":"cited_for_permanence","summary":"The author addresses the departure of community members who denied that Jesus is the Christ, interpreting their leaving as proof they were never genuinely part of the community, and affirming that the community's anointing from the Holy One gives them the knowledge to discern truth from falsehood.","relevance":"Verse 19 is conventionally cited to prove that true believers cannot fall away. The neutral reading supports the basic logic — genuine belonging produces remaining, and departure reveals non-belonging — but reveals that the context is a specific christological crisis (denial of the incarnation), not a general statement about all forms of spiritual failure or moral apostasy. Additionally, verses 22-23 tie standing to ongoing christological confession, which introduces a conditionality element within the same section.","key_phrases":["they went out from us, but they were not of us","if they had been of us, they would have remained with us","everyone who denies the Son does not have the Father","the one who confesses the Son has the Father also","you have an anointing from the Holy One"],"confidence":"medium"},

      {"reference":"1:3-6","section_title":"The Berakah Opens — Election and Adoption","category":"MISAPPLIED","conventional_use":"cited_for_permanence","summary":"The neutral reading identifies this as a Jewish berakah describing God's corporate election of a people — the 'us' being Jewish believers in continuity with Israel — chosen before the foundation of the world for the purpose of holiness and blamelessness, predestined for the adoptive sonship that was always Israel's privilege.","relevance":"Conventionally cited as proof that God individually predestined specific believers to irrevocable salvation before creation. The neutral reading shows the election language (eklegomai) follows its consistent LXX pattern: corporate election of a people to a purpose, not individual selection to a guaranteed status. The 'us' refers to Jewish believers, not all believers universally — the pronoun shift to 'you also' in v. 13 requires a prior group. The purpose clause 'to be holy and blameless before him' states election TO character and vocation, not election to irrevocable status.","key_phrases":["chose us in him before the foundation of the world","to be holy and blameless before him","predestined us for adoption as sons","according to the purpose of his will","in the Beloved"],"confidence":"medium"},
      {"reference":"1:7-12","section_title":"Redemption, the Mystery, and the First to Hope","category":"MISAPPLIED","conventional_use":"cited_for_permanence","summary":"The neutral reading identifies this section as describing corporate redemption through Christ's blood using Israel's exodus paradigm, the revelation of God's hidden plan (the mystery of Gentile inclusion as cosmic reunification under Christ's headship), and the identification of the 'we' as Jewish believers — 'those who were the first to hope in Christ.'","relevance":"Conventionally cited (especially v. 11) for individual predestination to an irrevocable inheritance. The neutral reading reframes every element: redemption (apolytrosis) follows the LXX exodus paradigm — corporate deliverance. The inheritance (eklērōthēmen) follows the LXX pattern of Israel's land allotment. 'We who were the first to hope in Christ' (tous proēlpikotas) restricts the referent to Jewish believers. The predestination is purposive and doxological — describing the goal of God's corporate plan, not guaranteeing individual irrevocability.","key_phrases":["we have redemption through his blood","the forgiveness of our trespasses","the mystery of his will","to unite all things in him","we have obtained an inheritance","we who were the first to hope in Christ","him who works all things according to the counsel of his will"],"confidence":"medium"},

      {"reference":"10:11-18","section_title":"I Am the Good Shepherd","category":"LEANS_PERMANENT","conventional_use":"not_in_debate","summary":"Jesus declares himself the good shepherd who voluntarily lays down his life for the sheep, contrasting his self-sacrificial commitment with the hired hand who abandons the flock to the wolf, and grounding the mutual shepherd-sheep knowledge in the Father-Son relationship.","relevance":"The shepherd's voluntary self-sacrifice for the sheep implies the strongest possible divine commitment to their security, and the mutual knowledge grounded in the Father-Son relationship suggests a bond resistant to severance. However, the section establishes the quality of Jesus's shepherding without directly addressing whether the sheep's standing is permanent regardless of their subsequent conduct.","key_phrases":["the good shepherd lays down his life for the sheep","I know my own and my own know me, even as the Father knows me and I know the Father","I lay down my life for the sheep","No one has taken it away from me, but I lay it down on my own initiative","I have authority to lay it down, and I have authority to take it up again"],"confidence":"medium"},

var PASS1 = JSON.parse("{\"Romans_08\":\"# Romans 8 -- Neutral Reading\\n\\n## Context and Placement\\n\\n**What the author was arguing immediately before (Romans 7):** Paul extended the death metaphor established in chapter 6 into the domain of the believer's relationship to the Torah. He opened with a legal principle drawn from marriage: a woman is bound to her husband while he lives, but if the husband dies, she is released from the law of the husband (7:1-3). Paul applied the analogy: \\\"you also have died to the law through the body of Christ, so that you may belong to another, to him who has been raised from the dead, in order that we may bear fruit for God\\\" (7:4). The death-with-Christ that chapter 6 described as dying to sin is now described as dying to the law. The purpose of this death is stated as belonging to the risen Christ and bearing fruit for God -- the fruit of holiness anticipated in 6:22.\\n\\nPaul then contrasted two modes of existence. When \\\"we were living in the flesh\\\" (7:5), sinful passions aroused by the law were at work in the body's members, producing fruit for death. But \\\"now we are released from the law, having died to that which held us captive, so that we serve in the new way of the Spirit and not in the old way of the written code\\\" (7:6). This verse is the hinge of the chapter, and it introduces the contrast between Spirit and written code (gramma) that chapter 8 will develop fully.\\n\\nThis arrangement raised a new objection: \\\"Is the law sin?\\\" (7:7). Paul answered with me genoito -- the same emphatic negation that answered the objection in 6:1 and 6:15. The law is not sin, but sin exploited the law. Paul described the mechanism: \\\"I would not have known what it is to covet if the law had not said, 'You shall not covet'\\\" (7:7, quoting the tenth commandment from Exodus 20:17/Deuteronomy 5:21). The commandment that named the sin became the occasion for sin to produce every kind of coveting (7:8). Paul declared: \\\"the law is holy, and the commandment is holy and righteous and good\\\" (7:12). The problem was not the law but sin, which used the good law to produce death (7:13).\\n\\nThe second half of chapter 7 (7:14-25) described the experience of the human being under the law and the power of sin. Paul used the first person singular ego throughout: \\\"I do not do the good I want to do, but the evil I do not want to do -- this I keep on doing\\\" (7:19). The identity of this \\\"I\\\" has been debated, but its function in Paul's argument is clear: it describes the condition of the person who knows what is right (through the law) but lacks the power to do it (because of sin dwelling in the flesh). The \\\"law of my mind\\\" recognizes what is good, but \\\"another law in my members\\\" -- the \\\"law of sin\\\" -- wars against it and takes the person captive (7:22-23). The passage built to a crescendo of despair: \\\"Wretched man that I am! Who will deliver me from this body of death?\\\" (7:24). The question is not rhetorical. It demands an answer. Paul supplied it: \\\"Thanks be to God through Jesus Christ our Lord!\\\" (7:25a). The deliverer has been identified but the mechanism of deliverance has not yet been explained. Chapter 7 closed with a compressed summary of the divided condition: \\\"So then, I myself serve the law of God with my mind, but with my flesh I serve the law of sin\\\" (7:25b). This statement -- a person simultaneously oriented toward God in mind and captive to sin in flesh -- is the condition that chapter 8 will resolve.\\n\\n**What the author argues immediately after (Romans 9):** Romans 9 opens with one of the most emotionally intense statements in Paul's letters: \\\"I have great sorrow and unceasing anguish in my heart. For I could wish that I myself were accursed and cut off from Christ for the sake of my brothers, my kinsmen according to the flesh\\\" (9:2-3). The shift is dramatic. Chapter 8 concluded with the triumphant declaration that nothing can separate believers from the love of God in Christ Jesus. Chapter 9 opens with Paul expressing a willingness to be separated from Christ for the sake of Israel. The juxtaposition is deliberately jarring.\\n\\nPaul identifies his kinsmen as Israelites, \\\"to whom belong the adoption (huiothesia), the glory (doxa), the covenants, the giving of the law, the worship, and the promises\\\" (9:4). The vocabulary is significant: huiothesia (\\\"adoption as sons\\\") appeared in 8:15 and 8:23 for the believer's sonship; doxa (\\\"glory\\\") appeared throughout chapter 8 as the believers' future hope. Paul now attributes these same realities to Israel by birthright. The question that drives chapters 9-11 is whether God's word has failed (9:6) -- whether the apparent exclusion of much of Israel from the gospel community means that God's promises to Israel have collapsed. Paul's answer begins: \\\"Not all who are descended from Israel belong to Israel, and not all are children of Abraham because they are his offspring, but 'Through Isaac shall your offspring be named'\\\" (9:6-7). The argument will develop through a complex engagement with God's freedom in election (9:6-29), Israel's failure to pursue righteousness by faith (9:30-10:21), and the ultimate hope that \\\"all Israel will be saved\\\" (11:26).\\n\\n**How chapter 8 connects these:** Romans 7 ended with a cry for deliverance from the divided condition of the person under sin's power, and with the compressed answer: deliverance comes through Jesus Christ our Lord. Romans 9 will open the question of Israel's status in light of the gospel. Romans 8 is the resolution of the crisis described in chapter 7 and the culmination of the argument that began in 5:1 (or even in 3:21). The chapter explains the mechanism that chapter 7 left unexplained: how the person who could not do what the law required is now enabled to fulfill it. The answer is the Spirit. The word pneuma (\\\"Spirit\\\") appears more than twenty times in chapter 8, compared to only once in chapter 7 (7:6, where Paul mentioned serving \\\"in the new way of the Spirit\\\" without elaborating). Chapter 8 is the elaboration. It explains what life \\\"in the Spirit\\\" consists of: no condemnation (8:1), liberation from the law of sin and death (8:2), fulfillment of the law's righteous requirement (8:4), a mind set on the things of the Spirit (8:5-6), the indwelling of God's Spirit (8:9-11), the putting to death of the deeds of the body (8:13), sonship and the cry \\\"Abba, Father\\\" (8:15-16), inheritance and co-suffering with Christ (8:17), future glory (8:18-25), the Spirit's intercession in weakness (8:26-27), and the assurance that God's purpose will hold against all external opposition (8:28-39).\\n\\nThe chapter also prepares for Romans 9-11 in specific ways. The adoption language (huiothesia) of 8:15 and 8:23 will reappear in 9:4 as belonging to Israel. The glory (doxa) that chapter 8 promises to believers will be named in 9:4 as Israel's heritage. The calling (klesis) and purpose (prothesis) of 8:28-30 will be developed in 9:6-29 in terms of God's sovereign freedom. And the inseparability of believers from God's love (8:35-39) will be set in tension with Paul's agonized question about Israel's apparent separation from Christ (9:1-5). Chapter 8 thus functions both as the climax of 5:1-8:39 (the exposition of life under grace) and as the platform from which the Israel question of 9:1-11:36 launches.\\n\\n---\\n\\n## Verses 1-4: No Condemnation, and What God Did Through His Son\\n\\n\\\"There is therefore now no condemnation for those who are in Christ Jesus\\\" (8:1).\\n\\nThe word ara (\\\"therefore, consequently\\\") draws a conclusion from everything that has preceded. The nyn (\\\"now\\\") marks the present era -- the same temporal marker Paul used in 3:21 (\\\"but now the righteousness of God has been manifested\\\") and 6:22 (\\\"but now, having been freed from sin\\\"). The \\\"now\\\" is not merely chronological but eschatological: it names the new age inaugurated by Christ's death and resurrection.\\n\\nThe word katakrima (\\\"condemnation, the sentence of condemnation, the guilty verdict and its execution\\\") appeared in 5:16 and 5:18. In 5:16, the krima (judgment) from one trespass led to katakrima (condemnation) for all. In 5:18, through one trespass katakrima came eis pantas anthropous -- \\\"to all human beings.\\\" Katakrima is the opposite of dikaioma (the righteous verdict). It is not merely \\\"feeling condemned\\\" or \\\"being accused\\\"; it is the executed sentence of a court -- the verdict of guilty and the penalty that follows. Paul now declares: this katakrima does not exist for those who are en Christo Iesou (\\\"in Christ Jesus\\\"). The dative en Christo locates the realm in which the condemnation is absent. It is the same locative formula used in 6:11 (\\\"alive to God in Christ Jesus\\\") and 6:23 (\\\"eternal life in Christ Jesus our Lord\\\"). The sphere of Christ's lordship is a sphere from which the sentence of condemnation has been removed.\\n\\nThe force of ouden (\\\"no, nothing, not any\\\") is absolute: not some condemnation, not reduced condemnation, but no condemnation whatsoever. For those who are in Christ Jesus, the verdict of 5:16 has been reversed. The katakrima that reached all human beings through Adam's trespass does not touch those who are in Christ.\\n\\nThe verse answers the cry of 7:24 (\\\"Wretched man that I am! Who will deliver me from this body of death?\\\"). The wretched man under sin's power faced condemnation -- the law that he could not keep condemned him (cf. 7:10: \\\"the very commandment that promised life proved to be death to me\\\"). But the person who is in Christ Jesus faces no condemnation, because God has acted to address what the law could not address. The next verses explain how.\\n\\n\\\"For the law of the Spirit of life has set you free in Christ Jesus from the law of sin and death\\\" (8:2).\\n\\nThe phrase ho nomos tou pneumatos tes zoes (\\\"the law of the Spirit of life\\\") introduces a compressed expression that requires careful unpacking. The word nomos (\\\"law\\\") has been used in multiple senses throughout the letter: as the Mosaic Torah (2:12-13, 3:19-21, 7:1-6), as a general principle or governing power (3:27, \\\"the law of faith\\\"; 7:21, \\\"I find then a law\\\"; 7:23, \\\"the law of sin in my members\\\"), and as the normative expression of God's will. Here, \\\"the law of the Spirit of life\\\" is the governing principle or operative power of the Spirit that produces life. The genitive chain identifies the Spirit as the agent and life as the product: the Spirit's operative power, which is life-producing. This contrasts with \\\"the law of sin and death\\\" (ho nomos tes hamartias kai tou thanatou) -- the governing power of sin that produces death, the same \\\"law of sin\\\" that Paul described in 7:23 as waging war against the law of his mind and taking him captive.\\n\\nThe verb eleutherosen (\\\"has set free,\\\" aorist active of eleutheroo) is the same verb used in 6:18 (\\\"having been freed from sin\\\") and 6:22 (\\\"having been freed from sin and having become slaves of God\\\"). The liberation language is consistent: what chapter 6 described as freedom from sin through co-death with Christ, chapter 8 now describes as freedom from \\\"the law of sin and death\\\" through the Spirit of life. The aorist tense points to a completed act of liberation -- it has already happened.\\n\\nThe phrase en Christo Iesou (\\\"in Christ Jesus\\\") may modify the freedom (\\\"set you free in Christ Jesus,\\\" indicating the sphere in which the liberation occurred) or the law of the Spirit (\\\"the law of the Spirit of life in Christ Jesus,\\\" indicating the sphere in which the Spirit's law operates). Either way, the liberation is located within the sphere of Christ.\\n\\n\\\"For God has done what the law, weakened by the flesh, could not do. By sending his own Son in the likeness of sinful flesh and for sin, he condemned sin in the flesh\\\" (8:3).\\n\\nThe phrase to gar adynaton tou nomou (\\\"for the impossible thing of the law\\\" or \\\"for what was impossible for the law\\\") identifies the law's limitation. The word adynaton (\\\"impossible, unable, powerless\\\") describes not a deficiency in the law itself but a deficiency in the law's capacity to produce the desired result when it encounters the flesh. Paul has already established this: the law is \\\"holy, righteous, and good\\\" (7:12), but sin exploited it (7:8, 11, 13), and the \\\"weakness of the flesh\\\" (7:18, \\\"nothing good dwells in me, that is, in my flesh\\\") rendered the law incapable of producing the obedience it demanded. The phrase en ho esthenei dia tes sarkos (\\\"in that it was weak through the flesh\\\") locates the weakness: not in the law but in the flesh (sarx). The law's inability was not intrinsic but relational -- it could not do its work because the material it had to work with (human flesh under sin's power) was too compromised.\\n\\nWhat God did is described in three participial and verbal phrases. First: ton heautou huion pempsas (\\\"sending his own Son\\\"). The verb pempo (\\\"to send\\\") with the reflexive heautou (\\\"his own\\\") emphasizes both the divine initiative and the costliness: God sent not a prophet, not an angel, not a representative, but his own Son. The phrase echoes 5:10 (\\\"reconciled through the death of his Son\\\") and anticipates 8:32 (\\\"did not spare his own Son\\\"). The word huios (\\\"son\\\") rather than doulos (\\\"servant\\\") or angelos (\\\"messenger\\\") marks the unique relationship between the sender and the sent one.\\n\\nSecond: en homoiomati sarkos hamartias (\\\"in the likeness of sinful flesh\\\"). The word homoioma (\\\"likeness, form, resemblance\\\") appeared in 6:5 for the believer's union with Christ \\\"in the likeness of his death.\\\" It indicates genuine participation in a reality without complete identity with it. The Son came in the likeness of sarx hamartias -- \\\"flesh of sin\\\" or \\\"sinful flesh.\\\" This is not docetic (denying that Christ had real flesh) but precise: Christ had real flesh (sarx), flesh that was genuinely human, genuinely subject to the conditions of the Adamic world. But his flesh was in the \\\"likeness\\\" of sinful flesh -- he participated in the human condition without being mastered by sin. The word hamartias is a genitive modifying sarkos: flesh that belongs to sin, flesh characterized by sin, flesh under sin's dominion. Christ entered this sphere -- the sphere of humanity under sin's conditions -- without being dominated by sin himself.\\n\\nThird: kai peri hamartias (\\\"and concerning sin\\\" or \\\"and as a sin offering\\\"). This phrase is critical. In the LXX, the expression peri hamartias is the standard rendering of the Hebrew chattat when it refers to the sin offering. Leviticus 4:3 (LXX): peri tes hamartias autou hes hemarten -- \\\"concerning his sin which he sinned,\\\" but the noun chattat itself (the offering) is regularly rendered peri hamartias throughout Leviticus 4-5, 6:25-30, and 16:3-27 (the Day of Atonement). In Leviticus 16:3 (LXX), Aaron enters the holy place with \\\"a bull for a sin offering\\\" (peri hamartias). Isaiah 53:10 (LXX) uses similar language: \\\"if you give a sin offering (peri hamartias), your soul shall see offspring.\\\" Paul has already identified Christ's death with the hilasterion -- the mercy seat where atonement blood was sprinkled (3:25). Here he identifies the sending of the Son with the sin offering itself. God sent his Son as the sacrifice that addresses sin.\\n\\nThe result: katekrinen ten hamartian en te sarki (\\\"he condemned sin in the flesh\\\"). The verb katekrinen (\\\"condemned,\\\" aorist active of katakrino) is the verbal form of the noun katakrima from verse 1. There is now no katakrima for those in Christ Jesus (v. 1) because God katekrinen -- condemned -- sin itself in the flesh (v. 3). The condemnation has not disappeared; it has been redirected. The sentence that was against the sinner has been executed against sin. The court has spoken, but the guilty party who receives the sentence is sin itself, not the person in Christ. The phrase en te sarki (\\\"in the flesh\\\") locates where the condemnation occurred: in the flesh of Christ, in the crucifixion, in the bodily death of the Son who bore the likeness of sinful flesh. Sin was condemned in the very territory where it had reigned -- in the flesh.\\n\\nThe logic connects directly to chapter 7. The law could not produce obedience because sin in the flesh exploited it. God addressed the problem at its root: he condemned sin in the flesh through the sin offering of his Son. The power that made the law unable to produce its intended result has been judicially sentenced and executed.\\n\\n\\\"In order that the righteous requirement of the law might be fulfilled in us, who walk not according to the flesh but according to the Spirit\\\" (8:4).\\n\\nThe purpose clause (hina) reveals why God condemned sin in the flesh. The word dikaioma (\\\"righteous requirement, just decree, righteous ordinance\\\") appeared in 1:32 for \\\"the righteous decree of God\\\" (that those who practice sin deserve death), in 2:26 for \\\"the requirements of the law\\\" that the uncircumcised might keep, and in 5:16 and 5:18 for the \\\"righteous verdict\\\" or \\\"righteous act\\\" that came through Christ. Here it is to dikaioma tou nomou -- \\\"the righteous requirement of the law,\\\" singular. Paul does not say \\\"the commandments of the law\\\" (plural) but \\\"the righteous requirement\\\" -- the singular, comprehensive demand of the Torah. This connects to Paul's statements elsewhere that the entire Torah is summarized in a single commandment: \\\"love your neighbor as yourself\\\" (13:8-10, citing Leviticus 19:18; cf. Galatians 5:14). The righteous requirement of the law is what the law, at its core, demands.\\n\\nThis requirement is to be plerothe (\\\"fulfilled,\\\" aorist passive subjunctive of pleroo, \\\"to fill up, to bring to completion, to fulfill\\\"). The passive voice leaves the agent unnamed -- the requirement is fulfilled in the believers, but Paul does not say they fulfill it by their own effort. The phrase en hemin (\\\"in us\\\") locates the fulfillment: in the community of those who are in Christ. And the fulfillment occurs in those \\\"who walk not according to the flesh but according to the Spirit\\\" (tois me kata sarka peripatousin alla kata pneuma). The verb peripateo (\\\"to walk, to conduct one's life\\\") is the same metaphor used in 6:4 (\\\"walk in newness of life\\\") and throughout the LXX for the conduct of life (halak). The contrast is between two governing principles: kata sarka (\\\"according to the flesh\\\") and kata pneuma (\\\"according to the Spirit\\\"). The preposition kata with the accusative indicates the standard or norm: walking in conformity with the flesh, or walking in conformity with the Spirit.\\n\\nThe participial clause (tois... peripatousin) is not a condition added to membership in Christ but a description of what characterizes those who are in Christ. Paul is not saying \\\"no condemnation for those who walk by the Spirit\\\" as though the walking earned the no-condemnation status. He is saying that those who are in Christ (v. 1) are characterized by Spirit-walking (v. 4), and the purpose of God's act in Christ was that the law's requirement might be fulfilled in precisely such people. The walking is the evidence and expression of the liberation, not its cause.\\n\\n---\\n\\n## Verses 5-11: The Two Modes of Existence -- Flesh and Spirit\\n\\n\\\"For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit set their minds on the things of the Spirit\\\" (8:5).\\n\\nThe phrase hoi kata sarka ontes (\\\"those who are according to the flesh\\\") uses the present participle of eimi (\\\"to be\\\") -- those whose existence is governed by the flesh. The corresponding phrase hoi kata pneuma (\\\"those who are according to the Spirit\\\") describes those whose existence is governed by the Spirit. The verb phroneo (\\\"to set the mind on, to think about, to be minded toward, to be oriented toward\\\") describes not merely intellectual activity but the whole orientation of the person -- desires, values, inclinations, habitual patterns of thought and aspiration. In Philippians 2:5, Paul uses the same verb: \\\"Have this mind (phroneite) among yourselves, which is yours in Christ Jesus.\\\" In Colossians 3:2: \\\"Set your minds (phroneite) on things that are above.\\\" The word captures the direction of the person's fundamental orientation.\\n\\nThe verse establishes a correspondence between identity and orientation. Those who exist according to the flesh are oriented toward the flesh's concerns. Those who exist according to the Spirit are oriented toward the Spirit's concerns. The alignment is not accidental; it flows from the governing principle. A person governed by the flesh naturally gravitates toward the flesh; a person governed by the Spirit naturally gravitates toward the Spirit.\\n\\nThe word sarx (\\\"flesh\\\") in Paul's usage throughout Romans is not simply the physical body. It encompasses the whole mode of human existence apart from God's Spirit -- human capacity, human striving, human identity rooted in the Adamic condition. In 7:5, \\\"when we were in the flesh\\\" described the pre-liberation state. In 7:14, \\\"I am of the flesh, sold under sin.\\\" In 7:18, \\\"nothing good dwells in me, that is, in my flesh.\\\" The flesh is the sphere where sin exercises its power, where the law proves impotent, where the human being remains captive. The Spirit is the counter-sphere: the domain of God's active power, the mode of existence in which the law's requirement can be fulfilled (8:4).\\n\\n\\\"For the mind set on the flesh is death, but the mind set on the Spirit is life and peace\\\" (8:6).\\n\\nThe word phronema (\\\"mindset, way of thinking, orientation, aspiration\\\") is the noun corresponding to the verb phroneo in verse 5. The phronema tes sarkos (\\\"the mindset of the flesh\\\") is thanatos -- death. Not merely the punishment for fleshly thinking, but its inherent nature: the orientation toward the flesh is, in itself, death. This connects to 6:21 (\\\"the end of those things is death\\\") and 6:23 (\\\"the wages of sin is death\\\"). Death is not an arbitrary penalty imposed from outside; it is the intrinsic outcome of the flesh's trajectory.\\n\\nThe phronema tou pneumatos (\\\"the mindset of the Spirit\\\") is zoe kai eirene -- \\\"life and peace.\\\" The pairing of zoe (\\\"life\\\") and eirene (\\\"peace\\\") brings together the two great consequences of justification from 5:1 (peace with God) and 5:21 (eternal life). Life is the opposite of death; peace is the opposite of the hostility between God and the person in the flesh. The Spirit's mindset produces the very realities that justification secured.\\n\\n\\\"For the mind set on the flesh is hostile to God, for it does not submit to God's law -- indeed, it cannot\\\" (8:7).\\n\\nThe word echthra (\\\"hostility, enmity\\\") is the noun form of the adjective echthros (\\\"enemy\\\") used in 5:10 (\\\"while we were enemies\\\"). The phronema of the flesh is not neutral territory -- it is actively hostile (echthra) toward God. The reason is stated: to nomo tou theou ouch hypotassetai (\\\"it does not submit to the law of God\\\"). The verb hypotasso (\\\"to place under, to subordinate, to submit\\\") is a military term -- to arrange under a commanding authority. The flesh-mindset does not place itself under the authority of God's law. And the further statement intensifies this: oude gar dynatai -- \\\"indeed, it cannot.\\\" The word dynatai (\\\"is able\\\") makes the incapacity absolute. The flesh-mindset does not merely choose not to submit; it is constitutionally unable to submit. This explains why the law was \\\"weakened by the flesh\\\" (8:3) and why the ego of chapter 7 could not do the good it recognized: the flesh lacks the capacity for obedience to God's law. It is not that the individual merely chooses poorly; the governing principle under which the individual operates is incapable of producing submission to God.\\n\\n\\\"Those who are in the flesh cannot please God\\\" (8:8).\\n\\nThe phrase hoi de en sarki ontes (\\\"those who are in the flesh\\\") uses the locative en -- those who exist within the sphere of the flesh, whose location is \\\"in\\\" the flesh as their governing domain. The verb aresai (aorist active infinitive of aresko, \\\"to please, to give satisfaction to\\\") theo (\\\"God\\\") ou dynantai (\\\"are not able\\\"). The absolute negation -- cannot please God -- is the negative counterpart to the positive principle that life in the Spirit produces obedience to God's law (8:4). In the sphere of the flesh, pleasing God is impossible.\\n\\nThe language echoes the LXX's descriptions of the pre-flood generation: Genesis 6:5, \\\"the LORD saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only evil continually.\\\" It also echoes Psalm 14:1-3 (LXX 13:1-3), which Paul quoted in 3:10-12: \\\"None is righteous, no, not one... no one does good, not even one.\\\" The impossibility described in 8:8 is the same impossibility that chapters 1-3 diagnosed: humanity in its Adamic condition, under sin's power, in the flesh, cannot produce what God requires.\\n\\n\\\"You, however, are not in the flesh but in the Spirit, if indeed the Spirit of God dwells in you. Anyone who does not have the Spirit of Christ does not belong to him\\\" (8:9).\\n\\nThe pronoun hymeis (\\\"you\\\") addresses the Roman believers directly. The de (\\\"however, but\\\") marks the contrast between the impossibility just described and the believers' actual situation. The assertion is spatial and governmental: ouk este en sarki alla en pneumati -- \\\"you are not in the flesh but in the Spirit.\\\" The believers have been transferred from one sphere to another. They are no longer located \\\"in\\\" the flesh (under its governance) but \\\"in\\\" the Spirit (under the Spirit's governance). This transfer corresponds to the transfer described in chapter 6: from slavery to sin to slavery to righteousness, from the dominion of death to the dominion of grace.\\n\\nThe conditional clause eiper pneuma theou oikei en hymin (\\\"if indeed the Spirit of God dwells in you\\\") introduces a significant qualifier. The conjunction eiper (\\\"if indeed, if in fact, assuming that\\\") is a conditional that assumes the truth of the condition for the audience being addressed (cf. 2 Thessalonians 1:6, \\\"since indeed God considers it just\\\"; 1 Corinthians 15:15, \\\"if in fact the dead are not raised\\\"). Paul is not expressing doubt about whether the Roman believers have the Spirit; he is stating the condition that defines their status. Having the Spirit of God dwelling (oikei, present active of oikeo, \\\"to dwell, to inhabit, to make one's home in\\\") in them is what constitutes their being \\\"in the Spirit\\\" rather than \\\"in the flesh.\\\"\\n\\nThe negative counterpart follows immediately: ei de tis pneuma Christou ouk echei, houtos ouk estin autou -- \\\"if anyone does not have the Spirit of Christ, this one does not belong to him.\\\" The formulation is stark. The criterion for belonging to Christ (estin autou -- literally \\\"is of him,\\\" indicating possession and relationship) is having the Spirit of Christ (pneuma Christou). Without the Spirit, there is no belonging. The Spirit is not an optional enhancement of the Christian life; it is the defining marker of being Christ's own.\\n\\nA Trinitarian observation about the language: Paul moves between \\\"Spirit of God\\\" (pneuma theou) and \\\"Spirit of Christ\\\" (pneuma Christou) without any signal that he means different things. In verse 9 alone, the Spirit is called \\\"the Spirit of God\\\" and \\\"the Spirit of Christ.\\\" In verse 11, the Spirit will be called \\\"the Spirit of him who raised Jesus from the dead.\\\" The fluidity of designation suggests that Paul does not draw sharp boundaries between the Spirit's relationship to the Father and to the Son. The one Spirit is the Spirit of God and the Spirit of Christ simultaneously.\\n\\n\\\"But if Christ is in you, although the body is dead because of sin, the Spirit is life because of righteousness\\\" (8:10).\\n\\nThe phrase ei de Christos en hymin (\\\"but if Christ is in you\\\") states the same reality from the other direction. Verse 9 spoke of the Spirit dwelling in the believer; verse 10 speaks of Christ being in the believer. The interchangeability is notable: the Spirit's indwelling and Christ's indwelling are the same reality described from different angles.\\n\\nThe consequence has two parts. First: to men soma nekron dia hamartian -- \\\"the body is dead because of sin.\\\" The word nekron (\\\"dead\\\") applied to the soma (\\\"body\\\") does not mean the body has ceased biological function. It means the body, as the locus of sin's activity (the \\\"body of sin\\\" of 6:6, the \\\"mortal body\\\" of 6:12, the \\\"body of death\\\" of 7:24), is dead in the sense that its old function under sin's dominion has been terminated. The dia hamartian (\\\"because of sin\\\") indicates the reason: sin caused the body's death -- both in the sense that Adamic sin brought mortality (5:12) and in the sense that the body's role as sin's instrument has been put to death through co-crucifixion with Christ (6:6). The body that served sin is nekron.\\n\\nSecond: to de pneuma zoe dia dikaiosynen -- \\\"the Spirit is life because of righteousness.\\\" The Spirit's presence constitutes zoe -- life. The dia dikaiosynen (\\\"because of righteousness\\\") corresponds to dia hamartian: as sin caused the body's death, so righteousness -- the righteousness of God, enacted through Christ (3:21-26), received through faith (4:3-5) -- is the ground of the Spirit's life-giving presence. The antithesis is precise: sin/death versus righteousness/life, the same polarity that has governed the letter since chapter 5.\\n\\n\\\"If the Spirit of him who raised Jesus from the dead dwells in you, he who raised Christ Jesus from the dead will also give life to your mortal bodies through his Spirit who dwells in you\\\" (8:11).\\n\\nThe conditional ei de (\\\"but if\\\") introduces the culminating promise of this section. The Spirit is identified by his most defining act: he is the Spirit of \\\"him who raised Jesus from the dead\\\" (tou egeirantos ton Iesoun ek nekron). The God who raised Jesus is the agent; the Spirit is the instrument; and the same power that raised Jesus is now the power that dwells in the believer. The verb oikei (\\\"dwells\\\") is repeated from verse 9 -- the same Spirit who dwells in the believers is the resurrection-power Spirit.\\n\\nThe promise: zoopoiesei kai ta thneta somata hymon dia tou enoikountos autou pneumatos en hymin -- \\\"he will also give life to your mortal bodies through his Spirit who dwells in you.\\\" The verb zoopoieo (\\\"to make alive, to give life to, to quicken\\\") is a compound: zoe (\\\"life\\\") + poieo (\\\"to make\\\"). It is used in the LXX for God's creation and life-giving activity (Nehemiah 9:6: \\\"you give life to all of them\\\"; cf. Genesis 2:7, where God breathed life into the man). The objects are ta thneta somata hymon -- \\\"your mortal bodies.\\\" The adjective thnetos (\\\"mortal, subject to death\\\") is the same word from 6:12 (\\\"do not let sin reign in your mortal body\\\"). The mortal body -- the body that is still subject to death, that has not yet been resurrected -- will be given life.\\n\\nThis verse introduces a dimension of the Spirit's work that goes beyond the present spiritual life described in verses 5-10. The Spirit's indwelling produces not only the present orientation toward life and peace (v. 6) but guarantees the future resurrection of the mortal body. The Spirit is the down payment (arrabon, 2 Corinthians 1:22, 5:5; Ephesians 1:14) of the full redemption that includes the body. The same God who raised Jesus from physical death will raise the believers from physical death, and the mechanism is the same: the Spirit.\\n\\n---\\n\\n## Verses 12-17: Obligation, Sonship, and Inheritance\\n\\n\\\"So then, brothers, we are debtors, not to the flesh, to live according to the flesh\\\" (8:12).\\n\\nThe phrase ara oun (\\\"so then, therefore\\\") draws a practical conclusion from the preceding theological exposition. The word opheiletai (\\\"debtors, those who owe an obligation\\\") is the noun form of opheilo (\\\"to owe, to be obligated\\\"). The image is of a debt -- an obligation that must be discharged. Paul states the obligation negatively: we are not debtors to the flesh. The believers do not owe the flesh the service of living according to its principles. The flesh, which once governed their existence (7:5, \\\"when we were in the flesh\\\"), no longer holds their debt of loyalty. They have been liberated (8:2), and the liberated person owes nothing to the former master.\\n\\nThe positive counterpart -- that they are debtors to the Spirit, to live according to the Spirit -- is implied but not stated. Paul leaves it unstated perhaps because the next verse makes the urgency of the negative clear: living according to the flesh results in death.\\n\\n\\\"For if you live according to the flesh you will die, but if by the Spirit you put to death the deeds of the body, you will live\\\" (8:13).\\n\\nThe conditional structure presents two outcomes with stark finality. The first: ei gar kata sarka zete, mellete apothneskein -- \\\"if you live according to the flesh, you are about to die.\\\" The verb mellete (present active of mello, \\\"to be about to, to be on the point of, to be destined to\\\") with the present infinitive apothneskein (\\\"to die\\\") indicates certain future outcome: if you live this way, death is where you are headed. The present tense zete (\\\"you live\\\") describes an ongoing pattern of life. The second person plural addresses the Roman believers directly. Paul is not speaking hypothetically about outsiders; he is warning the believers themselves that a return to flesh-governed existence leads to death. This warning is consonant with the imperatives of chapter 6: \\\"do not let sin reign in your mortal body\\\" (6:12), \\\"do not present your members as instruments of unrighteousness\\\" (6:13). The indicative (you have been freed) does not eliminate the imperative (you must live accordingly), and the failure to live accordingly has real consequences (death).\\n\\nThe second conditional: ei de pneumati tas praxeis tou somatos thanatoute, zesesthe -- \\\"but if by the Spirit you put to death the deeds of the body, you will live.\\\" The verb thanatoute (present active of thanatoo, \\\"to put to death, to kill, to mortify\\\") is in the present tense -- it describes an ongoing activity, not a one-time event. The agent is the believer (\\\"you put to death\\\"), but the instrument is the Spirit (pneumati -- dative of instrument, \\\"by means of the Spirit\\\"). The believers do the putting to death, but they do it by the Spirit's power, not by their own unaided effort. This resolves the dilemma of chapter 7: the ego could not do what it willed because of sin in the flesh (7:18-20). Now the Spirit provides the power that the ego lacked. The cooperation is real: the believer acts, but acts by the Spirit's enabling.\\n\\nThe word praxeis (\\\"deeds, practices, actions\\\") tou somatos (\\\"of the body\\\") describes the habitual actions of the body when it operates under the old regime -- the deeds that the body performed as sin's instrument (6:13, \\\"instruments of unrighteousness\\\"). These deeds must be continually put to death. The present tense of thanatoute indicates that this is not accomplished once for all but is an ongoing discipline of the Spirit-empowered life. The death to sin described in chapter 6 as a completed event (the baptismal death) here becomes an ongoing activity: the believer who died to sin in baptism continues to put to death the deeds of the body by the Spirit. The positional reality must be enacted practically.\\n\\n\\\"For all who are led by the Spirit of God are sons of God\\\" (8:14).\\n\\nThe conjunction gar (\\\"for\\\") connects this verse to the preceding: the reason the Spirit-empowered putting to death of the body's deeds leads to life is that those who are led by the Spirit are God's sons, and sons inherit life. The verb agontai (present passive of ago, \\\"to lead, to guide, to drive, to conduct\\\") describes the Spirit's governance -- the Spirit leads, and those who follow that leading are characterized as huioi theou (\\\"sons of God\\\").\\n\\nThe term \\\"sons of God\\\" (huioi theou) has deep roots in Israel's scriptures. Israel as a nation is called God's son: \\\"Israel is my firstborn son\\\" (Exodus 4:22); \\\"Out of Egypt I called my son\\\" (Hosea 11:1). The king of Israel is designated God's son: \\\"I will be to him a father, and he shall be to me a son\\\" (2 Samuel 7:14); \\\"You are my son; today I have begotten you\\\" (Psalm 2:7). In the Deuteonomic tradition, the Israelites are called \\\"sons of the LORD your God\\\" (Deuteronomy 14:1). The designation carries not ontological but relational and vocational meaning: the son bears the father's character, carries the father's mission, inherits the father's estate. To be a \\\"son of God\\\" is to stand in the relationship Israel stood in, to bear the identity Israel was called to bear.\\n\\nPaul's use of huioi rather than tekna (which appears in verse
