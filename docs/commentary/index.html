<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commentary</title>
<style>
  :root {
    --text: #1a1a1a;
    --bg: #faf8f5;
    --heading: #2c2416;
    --link: #5a6f3c;
    --muted: #7a7060;
    --border: #d4c9b0;
    --quote-bg: rgba(106, 90, 60, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text: #d4cfc8;
      --bg: #1c1a17;
      --heading: #e0d4c0;
      --link: #8aaa5c;
      --muted: #908878;
      --border: #3a3428;
      --quote-bg: rgba(196, 168, 108, 0.06);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 18px;
  }

  /* Same shell as the Bible viewer: a sticky bar carrying Home, where you are,
     and the way on. The commentary is a companion to the reading, so moving
     between the two should not feel like leaving a site and entering another. */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }

  .toolbar a { color: var(--link); text-decoration: none; }
  .toolbar a:hover { text-decoration: underline; }
  .toolbar .where { color: var(--muted); flex: 1; }
  .toolbar .where b { color: var(--heading); font-weight: 600; }
  .toolbar .nav { display: flex; gap: 14px; }
  .toolbar .off { color: var(--muted); opacity: 0.4; }

  main { max-width: 820px; margin: 0 auto; padding: 30px 20px 80px; }

  h1 {
    font-size: 27px;
    color: var(--heading);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-style: italic;
    margin-bottom: 34px;
  }

  .subtitle a { color: var(--link); }

  section { margin-bottom: 40px; scroll-margin-top: 60px; }

  h2 {
    font-size: 20px;
    color: var(--heading);
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
    margin-bottom: 4px;
  }

  .ref {
    font-size: 13px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin-bottom: 14px;
  }

  .ref a { color: var(--link); text-decoration: none; }
  .ref a:hover { text-decoration: underline; }

  /* A section about the chapter rather than a passage in it. Marked, because
     a reader arriving at "Context and Placement" should not have to work out
     why it carries no verse numbers. */
  section.whole-chapter h2 { border-bottom-style: dashed; }

  .body p { margin-bottom: 15px; }
  .body h3 { font-size: 17px; color: var(--heading); margin: 24px 0 8px; }
  .body strong { color: var(--heading); }
  .body em { font-style: italic; }
  .body ul, .body ol { margin: 12px 0 15px 26px; }
  .body li { margin-bottom: 6px; }

  .body blockquote {
    border-left: 3px solid var(--border);
    background: var(--quote-bg);
    padding: 8px 14px;
    margin: 15px 0;
    color: var(--muted);
  }

  .body table {
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
    width: 100%;
  }

  .body td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    vertical-align: top;
    line-height: 1.6;
  }

  .body tr:first-child td { color: var(--heading); font-weight: 600; }

  .msg { color: var(--muted); font-style: italic; padding: 40px 0; }

  .foot {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
  }

  .foot a { color: var(--link); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .foot .off { visibility: hidden; }

  @media (max-width: 700px) {
    body { font-size: 17px; }
    main { padding: 22px 16px 60px; }
    h1 { font-size: 23px; }
    .toolbar { padding: 8px 14px; gap: 10px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <a href="../index.html">Home</a>
  <span class="where" id="where"></span>
  <span class="nav" id="nav"></span>
</div>

<main id="main"><p class="msg">Loading&hellip;</p></main>

<script src="osis.js"></script>
<script>
'use strict';

/* The full-chapter view of the commentary.
 *
 *   commentary/index.html?book=ROM&ch=8
 *
 * It replaces the 260 hand-maintained HTML files that used to be the only way
 * to read a whole chapter. Those had to be edited in step with the markdown
 * they were built from; this reads the OSIS the pane reads, so there is one
 * source and nothing to keep in step.
 *
 * The section anchors are load-bearing. Both reports link to a section by
 * taking the part of '12:13-18' after the colon, so a section inside its own
 * chapter must be reachable at '#13-18'. Commentary.sectionId() owns that
 * rule for this page and the pane alike.
 */

var params = new URLSearchParams(location.search);
var book = (params.get('book') || '').toUpperCase();
var chapter = parseInt(params.get('ch'), 10);
var data = null;

function esc(s) { return Commentary.esc(s); }

function fail(msg) {
  document.getElementById('main').innerHTML = '<p class="msg">' + esc(msg) + '</p>';
}

function chapterLink(n, label) {
  if (!n) return '<span class="off">' + label + '</span>';
  return '<a href="?book=' + esc(book) + '&ch=' + n + '">' + label + '</a>';
}

function render() {
  var secs = Commentary.ofChapter(data.sections, chapter);
  if (!secs.length) { fail('No commentary for ' + book + ' ' + chapter + '.'); return; }

  var chapters = data.chapters;
  var at = chapters.indexOf(chapter);
  var prev = at > 0 ? chapters[at - 1] : null;
  var next = at >= 0 && at < chapters.length - 1 ? chapters[at + 1] : null;

  document.title = data.book + ' ' + chapter + ' — Commentary';
  document.getElementById('where').innerHTML =
    '<b>' + esc(data.book) + ' ' + chapter + '</b> &middot; Commentary';
  document.getElementById('nav').innerHTML =
    chapterLink(prev, '&larr; ' + (prev || '')) + chapterLink(next, (next || '') + ' &rarr;');

  // Straight back to the passage in the Bible, in the same tab, so Back and
  // Home keep working -- which matters most on a phone.
  var read = '../index.html?book=' + esc(book) + '#v' + chapter + '-1';

  var html = '<h1>' + esc(data.book) + ' ' + chapter + '</h1>' +
             '<p class="subtitle">Commentary &middot; ' +
             '<a href="' + read + '">Read ' + esc(data.book) + ' ' + chapter +
             ' in the RCB &rarr;</a></p>';

  // Two sections can want the same anchor -- a chapter has more than one
  // note on itself as a whole, and two passages can share a range. First
  // claim wins, so the id a report links to stays where it has always been.
  var used = {};

  for (var i = 0; i < secs.length; i++) {
    var s = secs[i];
    var id = Commentary.sectionId(s);
    if (used[id]) { id = id + '-' + (++used[id]); } else { used[id] = 1; }
    var refText = s.onVerses
      ? '<a href="' + '../index.html?book=' + esc(book) + '#v' + s.sc + '-' + s.sv + '">' +
        esc(data.book) + ' ' + Commentary.label(s) + '</a>'
      : 'On ' + esc(data.book) + ' ' + chapter + ' as a whole';

    html += '<section id="' + esc(id) + '"' +
            (s.onVerses ? '' : ' class="whole-chapter"') + '>' +
            '<h2>' + esc(s.title) + '</h2>' +
            '<div class="ref">' + refText + '</div>' +
            '<div class="body">' + s.html + '</div></section>';
  }

  html += '<div class="foot">' +
          (prev ? '<a href="?book=' + esc(book) + '&ch=' + prev + '">&larr; ' +
                  esc(data.book) + ' ' + prev + '</a>' : '<span class="off">&larr;</span>') +
          '<a href="' + read + '">Read the text</a>' +
          (next ? '<a href="?book=' + esc(book) + '&ch=' + next + '">' +
                  esc(data.book) + ' ' + next + ' &rarr;</a>'
                : '<span class="off">&rarr;</span>') +
          '</div>';

  document.getElementById('main').innerHTML = html;

  anchor();
}

/* Resolve the fragment after the content exists -- a report links straight to
 * '#13-18', and the browser resolved that against an empty page.
 *
 * Then hold the position. Scrolling once is not enough: the browser has its
 * own fragment navigation queued from the URL, and it runs after this and
 * lands a few hundred pixels past the section. So scroll, remember where that
 * put us, and put it back if anything moves it -- until a reader touches the
 * page, at which point their scroll wins and this stops.
 *
 * Holding scrollY rather than re-aiming at the element is deliberate: the
 * resting offset is 60px, not 0, because sections carry scroll-margin-top for
 * the sticky toolbar, so "is the element at the top" is the wrong question. */
function anchor() {
  if (!location.hash) return;
  var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (!el) return;

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  el.scrollIntoView();

  var want = Math.round(window.scrollY);
  var frames = 0;
  var abandoned = false;
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function(ev) {
    window.addEventListener(ev, function() { abandoned = true; }, { passive: true, once: true });
  });

  (function hold() {
    if (abandoned || frames++ > 40) return;
    if (Math.abs(window.scrollY - want) > 4) window.scrollTo(0, want);
    requestAnimationFrame(hold);
  })();
}

if (!book) {
  fail('No book given. Open a chapter from the Bible or from a report.');
} else {
  var s = document.createElement('script');
  s.src = 'data/' + book + '.js';
  s.onload = function() {
    try { data = Commentary.parse(OSIS); } catch (e) { data = null; }
    if (!data) { fail('The commentary for ' + book + ' could not be read.'); return; }
    if (!chapter || data.chapters.indexOf(chapter) === -1) chapter = data.chapters[0];
    render();
  };
  s.onerror = function() { fail('No commentary found for ' + book + '.'); };
  document.head.appendChild(s);
}
</script>
</body>
</html>
