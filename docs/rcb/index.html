<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restored Context Bible</title>
<!--
  The viewer moved to /index.html when the Restored Context Bible became the
  site's front door. Its data stayed here, under /rcb/data/.

  This stub exists for links and bookmarks made while the viewer lived at this
  address. It carries ?book= and the verse fragment across, so an old link to
  a passage still lands on that passage.
-->
<script>
  var q = window.location.search || '';
  var h = window.location.hash || '';
  window.location.replace('../index.html' + q + h);
</script>
<meta http-equiv="refresh" content="0; url=../index.html">
</head>
<body>
<p>The Restored Context Bible has moved to <a href="../index.html">the front page</a>.</p>
</body>
</html>
