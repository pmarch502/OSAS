<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restored Context Bible</title>
<style>
  :root {
    --text: #1a1a1a;
    --bg: #faf8f5;
    --restoration: #6a5a3c;
    --restoration-bg: rgba(106, 90, 60, 0.06);
    --verse-num: #8a7a5a;
    --heading: #2c2416;
    --intro-border: #d4c9b0;
    --link: #5a6f3c;
    --note: #c05030;
    --note-bg: rgba(192, 80, 48, 0.15);
    --muted: #7a7060;
    --toggle-bg: #e8e0d0;
    --toggle-active: #6a5a3c;
    --pane-bg: #f3efe7;
    --pane-border: #d4c9b0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text: #d4cfc8;
      --bg: #1c1a17;
      --restoration: #c4a86c;
      --restoration-bg: rgba(196, 168, 108, 0.08);
      --verse-num: #a09070;
      --heading: #e0d4c0;
      --intro-border: #3a3428;
      --link: #8aaa5c;
      --note: #e08060;
      --note-bg: rgba(224, 128, 96, 0.18);
      --muted: #908878;
      --toggle-bg: #2c2820;
      --toggle-active: #c4a86c;
      --pane-bg: #191714;
      --pane-border: #3a3428;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 18px;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--intro-border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
  }

  .toolbar-buttons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .home-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    margin-right: 12px;
  }

  .home-link:hover {
    color: var(--text);
  }

  /* The title is the site's identity now, not a breadcrumb, so it is set in the
     reading face rather than the interface one — and it is the way to the
     introduction, which is why it underlines on hover. */
  .toolbar-title {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--heading);
    font-size: 21px;
    letter-spacing: 0.01em;
    text-decoration: none;
  }

  .toolbar-title:hover { text-decoration: underline; }

  /* The book name is the way into the picker -- no separate button for it, so
     it has to read as a control at a glance rather than as a label. */
  .book-select {
    background: var(--toggle-bg);
    border: 1px solid var(--intro-border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    margin-left: 10px;
    padding: 3px 8px 3px 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    line-height: 1.2;
  }

  .book-select:hover {
    border-color: var(--toggle-active);
    background: var(--toggle-active);
    color: var(--bg);
  }

  .book-select .caret {
    font-size: 20px;
    line-height: 0.6;
    position: relative;
    top: -1px;
  }

  /* Smaller now that the title carries the weight. The words stay -- they are
     what says which control this is, and "restorations" is a term this edition
     has to teach -- so the on/off state is carried by the fill instead: filled
     and dark is on, dimmed outline is off. */
  .toggle-btn {
    background: none;
    border: 1px solid var(--intro-border);
    padding: 3px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .toggle-btn:hover {
    border-color: var(--toggle-active);
    color: var(--heading);
  }

  .toggle-btn.active {
    background: var(--toggle-active);
    border-color: var(--toggle-active);
    color: var(--bg);
  }

  .toggle-btn.active:hover { color: var(--bg); }

  /* ---- Layout: reading column beside the commentary pane ---- */

  :root {
    --pane-w: 400px;
    --text-max: 680px;
    --toolbar-h: 49px;
  }

  /* With the commentary hidden, the reason to hide it is almost always to get
     more text on screen -- so the column widens rather than just recentring.
     Capped for line length; raise --text-max-wide to let it fill further. */
  :root { --text-max-wide: 1100px; }
  body:not(.show-commentary) { --text-max: var(--text-max-wide); }

  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 20px;
  }

  .container {
    max-width: var(--text-max);
    width: 100%;
    padding: 30px 0 80px;
    min-width: 0;
  }

  .divider {
    display: none;
    flex: 0 0 auto;
    width: 21px;
    position: sticky;
    top: var(--toolbar-h);
    height: calc(100vh - var(--toolbar-h));
    cursor: col-resize;
    background: none;
    border: none;
    padding: 0;
  }

  body.show-commentary .divider { display: block; }

  .divider::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--pane-border);
    transition: background 0.15s, width 0.15s;
  }

  .divider:hover::before,
  .divider.dragging::before {
    background: var(--toggle-active);
    width: 3px;
    left: 9px;
  }

  body.resizing { user-select: none; cursor: col-resize; }

  .pane {
    display: none;
    width: var(--pane-w);
    flex-shrink: 0;
    position: sticky;
    top: var(--toolbar-h);
    max-height: calc(100vh - var(--toolbar-h));
    overflow-y: auto;
    background: var(--pane-bg);
    border-left: 1px solid var(--pane-border);
    border-right: 1px solid var(--pane-border);
    padding: 20px 22px 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }

  body.show-commentary .pane { display: block; }

  .pane-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .pane-ref {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 20px;
    color: var(--heading);
    margin-bottom: 2px;
  }

  .pane-title {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 16px;
  }

  .pane-body {
    font-size: 14.5px;
  }

  .pane-body p {
    margin-bottom: 12px;
    text-align: left;
  }

  .pane-body h3 {
    font-size: 14px;
    color: var(--heading);
    margin: 18px 0 6px;
  }

  .pane-body blockquote {
    border-left: 3px solid var(--pane-border);
    padding: 4px 0 4px 12px;
    margin: 12px 0;
    color: var(--muted);
  }

  .pane-body ul, .pane-body ol { margin: 10px 0 12px 20px; }
  .pane-body li { margin-bottom: 5px; }
  .pane-body strong { color: var(--heading); }
  .pane-body a { color: var(--link); }
  .pane-body hr { display: none; }

  .pane-empty {
    color: var(--muted);
    font-style: italic;
    font-size: 14px;
  }

  /* The verdicts are pulled, not pushed. One line states how many topics have
     something to say about the passage and opens the list on demand, so the
     pane reads the same with two topics as it would with twenty. */
  /* No section for the verse, so the line follows the reference directly. */
  .pane-ref + .topics { margin-top: 14px; }

  .topics {
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--pane-border);
  }

  .topic-summary {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }

  .topic-summary:hover { color: var(--link); }
  .topic-summary:hover .topic-summary-text { text-decoration: underline; }

  /* Sized to be seen. A disclosure control the reader's eye slides over is a
     control that does not exist. */
  .topic-caret {
    color: var(--link);
    font-size: 17px;
    line-height: 1;
    transition: transform 0.12s ease;
  }

  .topics.open .topic-caret { transform: rotate(90deg); }

  .topic-list { display: none; margin-top: 12px; }
  .topics.open .topic-list { display: block; }

  .topic-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .topic-row:last-child { margin-bottom: 0; }

  .topic-name {
    color: var(--muted);
    flex-shrink: 0;
    width: 78px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-decoration: none;
    border: 1px solid transparent;
  }

  .badge:hover { border-color: currentColor; }

  .badge.cat-strong { background: rgba(192, 80, 48, 0.16); color: #b04a28; }
  .badge.cat-leans  { background: rgba(106, 90, 60, 0.14); color: #6a5a3c; }
  .badge.cat-mis    { background: rgba(90, 111, 60, 0.16); color: #4d6033; }
  .badge.cat-na     { background: rgba(122, 112, 96, 0.12); color: var(--muted); }

  @media (prefers-color-scheme: dark) {
    .badge.cat-strong { background: rgba(224, 128, 96, 0.18); color: #e08060; }
    .badge.cat-leans  { background: rgba(196, 168, 108, 0.16); color: #c4a86c; }
    .badge.cat-mis    { background: rgba(138, 170, 92, 0.18); color: #8aaa5c; }
  }

  .pane-footer {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--pane-border);
    font-size: 13px;
  }

  .pane-footer a {
    color: var(--link);
    text-decoration: none;
  }

  .pane-footer a:hover { text-decoration: underline; }

  /* ---- Reading column ---- */

  .book-title {
    font-size: 32px;
    font-weight: normal;
    color: var(--heading);
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ---- The introduction (?book=INTRO) ----
     A Bible opens on its title page, not on Matthew 1. This is that page: what
     the brackets are, what text is behind the translation, and who made it.
     It reuses the reading column, so it needs only its own headings. */

  .rcb-intro-h {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 21px;
    font-weight: normal;
    color: var(--heading);
    margin: 38px 0 12px;
  }

  .rcb-intro-body p { margin-bottom: 14px; }
  .rcb-intro-body ul { margin: 0 0 14px 24px; }
  .rcb-intro-body li { margin-bottom: 8px; }
  .rcb-intro-body a { color: var(--link); }

  /* Shows the reader what a restoration looks like before they meet one. */
  .rcb-intro-eg {
    color: var(--restoration);
    background: var(--restoration-bg);
  }

  .rcb-intro-list {
    color: var(--muted);
    font-size: 16.5px;
    padding-left: 18px;
    border-left: 2px solid var(--intro-border);
  }

  .rcb-intro-start {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--intro-border);
    color: var(--muted);
    font-style: italic;
  }

  /* The reading column widens to 1100px with the commentary off, which suits
     verse text and is too long a line for continuous prose. */
  body.rcb-intro { --text-max: 720px; }

  /* Nothing to sync a commentary to, so the pane and its control step aside. */
  body.rcb-intro .pane,
  body.rcb-intro .divider,
  body.rcb-intro #commentaryBtn,
  body.rcb-intro #toggleBtn { display: none; }

  .intro {
    border-left: 3px solid var(--intro-border);
    padding: 16px 20px;
    margin-bottom: 40px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
  }

  .intro p {
    margin-bottom: 12px;
  }

  .intro p:last-child {
    margin-bottom: 0;
  }

  .chapter-num {
    display: block;
    font-size: 48px;
    color: var(--heading);
    font-weight: normal;
    line-height: 1;
    margin-bottom: 8px;
    margin-top: 40px;
    scroll-margin-top: 60px;
  }

  .chapter-num:first-of-type {
    margin-top: 0;
  }

  .section-heading {
    scroll-margin-top: 60px;
    font-size: 16px;
    font-weight: bold;
    color: var(--heading);
    margin-top: 28px;
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: 0.3px;
  }

  .paragraph {
    margin-bottom: 8px;
    text-align: justify;
    text-indent: 0;
  }

  .verse-num {
    font-size: 14px;
    font-weight: bold;
    color: var(--text);
    vertical-align: super;
    line-height: 0;
    margin-right: 3px;
    scroll-margin-top: 60px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .restoration {
    color: var(--restoration);
    background: var(--restoration-bg);
    border-radius: 2px;
    padding: 0 1px;
    font-size: 0.92em;
    transition: opacity 0.3s, color 0.3s;
  }

  body.hide-restorations .restoration {
    opacity: 0;
    font-size: 0;
    padding: 0;
    margin: 0;
  }

  .note-marker {
    font-size: 11px;
    font-weight: bold;
    color: var(--note);
    background: var(--note-bg);
    vertical-align: super;
    line-height: 0;
    cursor: pointer;
    padding: 1px 3px;
    border: 1px solid var(--note);
    border-radius: 3px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .note-marker:hover {
    background: var(--note);
    color: #fff;
    border-color: var(--note);
  }

  .footnote-popup {
    display: none;
    position: absolute;
    background: var(--bg);
    border: 1px solid var(--intro-border);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14px;
    max-width: 360px;
    line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 200;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .error-msg {
    text-align: center;
    color: var(--muted);
    margin-top: 4rem;
    font-size: 1.1rem;
  }

  /* ---- Reference picker: book blocks -> chapter blocks -> verse blocks ---- */

  .picker-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 300;
    padding: 24px 20px;
    overflow-y: auto;
  }

  .picker-backdrop.open { display: block; }

  /* Deliberately small. The whole point of a block grid is that everything is
     within a short mouse move of everything else -- a wide card undoes that. */
  .picker {
    background: var(--bg);
    border: 1px solid var(--intro-border);
    border-radius: 6px;
    max-width: 400px;
    margin: 0 auto;
    padding: 14px 16px 18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
  }

  .picker-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
    gap: 10px;
  }

  .picker-crumb {
    font-size: 13px;
    color: var(--heading);
    font-weight: 600;
  }

  .picker-search {
    width: 100%;
    box-sizing: border-box;
    background: var(--toggle-bg);
    border: 1px solid var(--intro-border);
    border-radius: 4px;
    padding: 6px 9px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .picker-search:focus {
    outline: none;
    border-color: var(--toggle-active);
  }

  .picker-hint {
    font-size: 11.5px;
    color: var(--muted);
    min-height: 16px;
    margin-bottom: 7px;
  }

  .picker-hint.hit { color: var(--link); }
  .picker-hint.miss { color: var(--note); }

  .picker-crumb button {
    background: none;
    border: none;
    color: var(--link);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  .picker-crumb button:hover { text-decoration: underline; }
  .picker-crumb .sep { color: var(--muted); margin: 0 6px; font-weight: normal; }

  .picker-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .picker-front {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .picker-front:hover { color: var(--link); text-decoration: underline; }
  .picker-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }

  .picker-close:hover { color: var(--text); }

  /* Genre bands, so the grid groups itself by colour and needs no headings.
     Five colours cover all 66 books; genres pair across the testaments the way
     the reader meets them -- narrative of origins, national history, reflective
     writing, prophecy, apocalyptic. */
  :root {
    --g-olive: #cfc98f;    /* Torah + Gospels          */
    --g-teal: #a8c8cb;     /* OT history + Acts        */
    --g-brown: #d3b5a4;    /* Wisdom + the epistles    */
    --g-green: #b6ccad;    /* Major prophets + general letters */
    --g-maroon: #d3aeb3;   /* Minor prophets + Revelation      */
    --g-fg: #2b2620;
    --grid-line: var(--intro-border);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --g-olive: #5f5c26;
      --g-teal: #23515a;
      --g-brown: #5b3d2f;
      --g-green: #35502e;
      --g-maroon: #5d333a;
      --g-fg: #ece7dd;
      --grid-line: #14120f;
    }
  }

  /* Gaps show the page background rather than a grid colour, so trailing empty
     cells in a part-filled row simply disappear instead of leaving a slab. */
  .blocks {
    display: grid;
    gap: 1px;
    background: var(--bg);
    border: 1px solid var(--grid-line);
  }

  .blocks.books { grid-template-columns: repeat(5, 1fr); }
  .blocks.nums  { grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); }

  .block {
    background: var(--toggle-bg);
    border: none;
    padding: 5px 2px;
    font-size: 11.5px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .block.g-law,
  .block.g-gospel          { background: var(--g-olive);  color: var(--g-fg); }
  .block.g-history         { background: var(--g-teal);   color: var(--g-fg); }
  .block.g-wisdom,
  .block.g-epistle         { background: var(--g-brown);  color: var(--g-fg); }
  .block.g-prophets,
  .block.g-general         { background: var(--g-green);  color: var(--g-fg); }
  .block.g-prophets-minor,
  .block.g-apocalyptic     { background: var(--g-maroon); color: var(--g-fg); }

  .block:hover {
    filter: brightness(1.18);
  }

  .blocks.nums .block:hover {
    background: var(--toggle-active);
    color: var(--bg);
    filter: none;
  }

  .block.current {
    outline: 2px solid var(--toggle-active);
    outline-offset: -2px;
    font-weight: 700;
  }

  /* ---- Narrow screens: the pane becomes a bottom sheet ---- */

  @media (max-width: 1100px) {
    .layout { display: block; padding: 0 20px; }
    /* Stacked, so there is no split to drag and the text is already full width. */
    .container { margin: 0 auto; max-width: var(--text-max-wide); }
    body.show-commentary .divider { display: none; }

    .pane {
      position: fixed;
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      max-height: 46vh;
      border-left: none;
      border-right: none;
      border-top: 1px solid var(--pane-border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.14);
      z-index: 150;
      padding-bottom: 24px;
    }

    body.show-commentary .container { padding-bottom: 48vh; }
  }

  /* Two toggles plus the title will not fit a phone, and the title is the part
     a reader already knows. Keep the book name. */
  @media (max-width: 620px) {
    .toolbar { padding: 8px 12px; }
    .toolbar-title { display: none; }
    .book-select { margin-left: 0; font-size: 14px; }
    /* The toggles keep their desktop size here — they are already small, and
       a tap target should not shrink further. The picker's head row is the
       route to the introduction once the title is hidden. */
  }
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <a class="toolbar-title" href="index.html?book=INTRO"
       title="Introduction &mdash; what this translation is">Restored Context Bible</a>
    <button class="book-select" id="bookSelect" onclick="openPicker()"
            title="Go to a passage">
      <span id="toolbar-book"></span><span class="caret">&#9662;</span>
    </button>
  </div>
  <div class="toolbar-buttons">
    <button class="toggle-btn active" id="toggleBtn" aria-pressed="true"
            onclick="toggleRestorations()" title="Show or hide the restorations">
      Restorations
    </button>
    <button class="toggle-btn" id="commentaryBtn" aria-pressed="false"
            onclick="toggleCommentary()" title="Show or hide the commentary">
      Commentary
    </button>
  </div>
</div>

<div class="layout">
  <div class="container" id="content"></div>
  <div class="divider" id="divider" title="Drag to resize"></div>
  <aside class="pane" id="pane">
    <div class="pane-label">Commentary</div>
    <div id="paneInner"><p class="pane-empty">Scroll the text to follow along.</p></div>
  </aside>
</div>

<div class="picker-backdrop" id="pickerBackdrop">
  <div class="picker" id="picker"></div>
</div>

<script src="rcb/data/index.js"></script>
<script>
function slugify(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function parseUSFM(usfm) {
  const lines = usfm.split('\n');
  let html = '';
  let bookTitle = '';
  let inIntro = false;
  let introHtml = '';
  let inParagraph = false;
  let currentChapter = 0;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('\\id ') || line.startsWith('\\toc')) continue;
    if (line.startsWith('\\h ')) {
      bookTitle = line.substring(3).trim();
      continue;
    }
    if (line.startsWith('\\mt1 ')) {
      html += '<div class="book-title">' + line.substring(5).trim() + '</div>';
      continue;
    }

    if (line.startsWith('\\imt ')) {
      inIntro = true;
      introHtml = '';
      continue;
    }
    if (line.startsWith('\\ip ')) {
      introHtml += '<p>' + renderInline(line.substring(4).trim()) + '</p>';
      continue;
    }

    if (line.startsWith('\\c ')) {
      if (inIntro) {
        html += '<div class="intro">' + introHtml + '</div>';
        inIntro = false;
      }
      if (inParagraph) {
        html += '</div>';
        inParagraph = false;
      }
      currentChapter = parseInt(line.substring(3).trim());
      noteCounter = 0;
      html += '<span class="chapter-num" id="ch' + currentChapter + '">' + currentChapter + '</span>';
      continue;
    }

    if (line.startsWith('\\s1 ')) {
      if (inParagraph) {
        html += '</div>';
        inParagraph = false;
      }
      var headingText = line.substring(4).trim();
      var id = 'ch' + currentChapter + '-' + slugify(headingText);
      html += '<div class="section-heading" id="' + id + '">' + renderInline(headingText) + '</div>';
      continue;
    }

    if (line === '\\p') {
      if (inParagraph) {
        html += '</div>';
      }
      html += '<div class="paragraph">';
      inParagraph = true;
      continue;
    }

    if (line.startsWith('\\v ')) {
      const rest = line.substring(3).trim();
      const spaceIdx = rest.indexOf(' ');
      const verseNum = rest.substring(0, spaceIdx);
      const verseText = rest.substring(spaceIdx + 1);
      html += '<span class="verse-num" id="v' + currentChapter + '-' + verseNum + '">' + verseNum + '</span>' + renderInline(verseText) + ' ';
      continue;
    }
  }

  if (inParagraph) html += '</div>';
  if (inIntro) html += '<div class="intro">' + introHtml + '</div>';

  document.getElementById('toolbar-book').textContent = bookTitle;
  return html;
}

let noteCounter = 0;

function renderInline(text) {
  text = text.replace(/\\u([0-9a-fA-F]{4})/g, function(_, hex) { return String.fromCharCode(parseInt(hex, 16)); });

  text = text.replace(/\\f \+ \\fr ([^ ]+) \\ft (.*?)\\f\*/g, function(match, ref, noteText) {
    noteCounter++;
    var letter = String.fromCharCode(96 + ((noteCounter - 1) % 26) + 1);
    var safeText = noteText.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;');
    safeText = safeText.replace(/\\tl\s+(.*?)\\tl\*/g, '<em>$1</em>');
    return '<span class="note-marker" data-note="' + safeText + '" onclick="showNote(event, this)" onmouseenter="showNoteHover(event, this)" onmouseleave="hideNoteHover()">' + letter + '</span>';
  });

  text = text.replace(/\\add\s+(.*?)\\add\*/g, '<span class="restoration">$1</span>');
  text = text.replace(/\\tl\s+(.*?)\\tl\*/g, '<em>$1</em>');

  return text;
}

// Truncate HTML without cutting inside a tag or an entity, and close any open <em>.
function truncateHtml(html, max) {
  var out = '', count = 0, i = 0, open = 0;
  while (i < html.length && count < max) {
    if (html.charAt(i) === '<') {
      var end = html.indexOf('>', i);
      if (end === -1) break;
      var tag = html.substring(i, end + 1);
      if (tag === '<em>') open++;
      else if (tag === '</em>') open--;
      out += tag;
      i = end + 1;
    } else if (html.charAt(i) === '&') {
      var semi = html.indexOf(';', i);
      if (semi !== -1 && semi - i <= 6) {
        out += html.substring(i, semi + 1);
        i = semi + 1;
      } else {
        out += html.charAt(i);
        i++;
      }
      count++;
    } else {
      out += html.charAt(i);
      i++;
      count++;
    }
  }
  while (open-- > 0) out += '</em>';
  if (i < html.length) out += '…';
  return out;
}

function toggleRestorations() {
  var btn = document.getElementById('toggleBtn');
  document.body.classList.toggle('hide-restorations');
  var hidden = document.body.classList.contains('hide-restorations');
  // The label stays put; the button's fill carries the state.
  btn.classList.toggle('active', !hidden);
  btn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
  // Verse offsets move when the restorations collapse.
  measureVerses();
  updatePane();
}

let popupPinned = false;

function positionPopup(popup, el) {
  var rect = el.getBoundingClientRect();
  var left = Math.max(10, Math.min(rect.left, window.innerWidth - 380));
  popup.style.left = left + 'px';
  popup.style.top = (rect.bottom + window.scrollY + 8) + 'px';
}

function showNoteHover(event, el) {
  if (popupPinned) return;
  var popup = document.getElementById('footnotePopup');
  var text = el.getAttribute('data-note');
  popup.innerHTML = truncateHtml(text, 120);
  popup.style.display = 'block';
  positionPopup(popup, el);
}

function hideNoteHover() {
  if (popupPinned) return;
  document.getElementById('footnotePopup').style.display = 'none';
}

function showNote(event, el) {
  event.stopPropagation();
  popupPinned = true;
  var popup = document.getElementById('footnotePopup');
  popup.innerHTML = el.getAttribute('data-note');
  popup.style.display = 'block';
  positionPopup(popup, el);
}

document.addEventListener('click', function() {
  popupPinned = false;
  document.getElementById('footnotePopup').style.display = 'none';
});

/* ==================== Commentary pane ====================
 *
 * The RCB, the exegesis and the two topical reports were built separately but
 * share one key: a verse range. So the pane syncs on verse containment rather
 * than by matching section headings -- the RCB's \s1 divisions and the
 * exegesis's divisions agree most of the time but not always (Romans 8 breaks
 * at v9 in the RCB and v5 in the exegesis), and containment is immune to that.
 */

// USFM code -> the stem used by exegesis/nt/{Stem}_{NN}.html
var EXEGESIS_BOOKS = {
  MAT: 'Matthew', MRK: 'Mark', LUK: 'Luke', JHN: 'John', ACT: 'Acts',
  ROM: 'Romans', '1CO': '1Corinthians', '2CO': '2Corinthians',
  GAL: 'Galatians', EPH: 'Ephesians', PHP: 'Philippians', COL: 'Colossians',
  '1TH': '1Thessalonians', '2TH': '2Thessalonians', '1TI': '1Timothy',
  '2TI': '2Timothy', TIT: 'Titus', PHM: 'Philemon', HEB: 'Hebrews',
  JAS: 'James', '1PE': '1Peter', '2PE': '2Peter', '1JN': '1John',
  '2JN': '2John', '3JN': '3John', JUD: 'Jude', REV: 'Revelation'
};

var TOPIC_NAMES = { o: 'OSAS', d: 'Determinism' };
var TOPIC_PATHS = { o: 'osas', d: 'determinism' };

var currentBook = null;
var verseIndex = [];        // [{ch, v, top}] sorted by document position
var exegesisCache = {};     // chapter -> [{start, end, title, html}] | 'loading' | null
var topicsLoaded = false;
var paneOn = false;
var topicsOpen = readTopicsOpen();   // whether the verdict list is expanded

function readTopicsOpen() {
  try { return localStorage.getItem('rcb-topics-open') === '1'; } catch (e) { return false; }
}
var lastKey = null;

// Where a section starts or ends mid-verse the id holds only its first verse
// token -- the heading "Verses 16b-18" carries id="16" -- so reading ranges off
// the ids alone leaves gaps the pane would render blank (31 of them across the
// NT). The heading text has the true range; the id is the fallback.
function parseHeadingRange(text, id) {
  var m = /^Verses?\s+(\d+)[ab]?(?:\s*[-–]\s*(\d+)[ab]?)?/i.exec(String(text).trim());
  if (m) return { start: parseInt(m[1], 10), end: parseInt(m[2] || m[1], 10) };
  var n = /^(\d+)[a-z]?(?:-(\d+)[a-z]?)?$/.exec(String(id).trim());
  if (!n) return null;
  return { start: parseInt(n[1], 10), end: parseInt(n[2] || n[1], 10) };
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

// Record where every verse sits, so scroll tracking is a binary search rather
// than a getBoundingClientRect over ~1,100 elements per scroll event.
function measureVerses() {
  verseIndex = [];
  var spans = document.querySelectorAll('#content .verse-num');
  for (var i = 0; i < spans.length; i++) {
    var parts = spans[i].id.substring(1).split('-');
    verseIndex.push({
      ch: parseInt(parts[0], 10),
      v: parseInt(parts[1], 10),
      top: spans[i].getBoundingClientRect().top + window.scrollY
    });
  }
}

var READING_LINE = 140;

/* A verse arrived at by link or by the picker governs the pane until the
 * reader scrolls away. Without this the pane follows the scroll position
 * instead of the request, and the two disagree wherever the page cannot put
 * the verse on the reading line -- Revelation 22:21 is the last verse in the
 * NT, so the document simply ends and the pane fell back to 22:12. */
var pinnedVerse = null;

function pinVerse(ch, v) {
  pinnedVerse = { ch: ch, v: v };
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function(ev) {
    window.addEventListener(ev, unpinVerse, { passive: true, once: true });
  });
}

function unpinVerse() {
  if (!pinnedVerse) return;
  pinnedVerse = null;
  lastKey = null;
  updatePane();
}

// The verse being read: the last one starting at or above the reading line.
function currentVerse() {
  if (!verseIndex.length) return null;
  var line = window.scrollY + READING_LINE;
  var lo = 0, hi = verseIndex.length - 1, best = 0;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (verseIndex[mid].top <= line) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return verseIndex[best];
}

/* ---- The reader's place ----
 *
 * A bookmark, not history. It exists so the front door can put the reader back
 * where they were: Home from an exegesis chapter returns to the passage they
 * left rather than to a default book, and closing the tab and coming back the
 * next day keeps the place a physical ribbon would have kept.
 *
 * An explicit ?book= or #verse always wins, so this only ever fills in a bare
 * visit. Following an RCB link from a report does move the bookmark -- that is
 * reading, and a ribbon moves when you read.
 */
var PLACE_KEY = 'rcb-place';
var placeSaved = '';

function savePlace() {
  if (!currentBook) return;
  var pos = activeVerse();
  if (!pos) return;
  var val = currentBook + '.' + pos.ch + '.' + pos.v;
  if (val === placeSaved) return;     // one write per verse, not per frame
  placeSaved = val;
  try { localStorage.setItem(PLACE_KEY, val); } catch (e) {}
}

function readPlace() {
  var raw = null;
  try { raw = localStorage.getItem(PLACE_KEY); } catch (e) { return null; }
  var m = raw && /^([A-Z0-9]{3})\.(\d+)\.(\d+)$/.exec(raw);
  return m ? { book: m[1], ch: parseInt(m[2], 10), v: parseInt(m[3], 10) } : null;
}

function loadExegesis(chapter, done) {
  if (exegesisCache[chapter] === 'loading') return;
  if (exegesisCache[chapter] !== undefined) { done(); return; }

  var stem = EXEGESIS_BOOKS[currentBook];
  if (!stem) { exegesisCache[chapter] = null; done(); return; }

  exegesisCache[chapter] = 'loading';
  fetch('exegesis/nt/' + stem + '_' + pad2(chapter) + '.html')
    .then(function(r) {
      if (!r.ok) throw new Error('not found');
      return r.text();
    })
    .then(function(text) {
      var doc = new DOMParser().parseFromString(text, 'text/html');
      var sections = [];
      var heads = doc.querySelectorAll('h2[id]');
      for (var i = 0; i < heads.length; i++) {
        var range = parseHeadingRange(heads[i].textContent, heads[i].id);
        if (!range) continue;
        var html = '';
        var node = heads[i].nextElementSibling;
        while (node && node.tagName !== 'H2') {
          if (node.tagName !== 'HR' && !node.classList.contains('nav')) {
            html += node.outerHTML;
          }
          node = node.nextElementSibling;
        }
        var title = heads[i].textContent.replace(/^Verses?\s+[\d\-a-z]+:\s*/i, '');
        sections.push({ start: range.start, end: range.end, title: title, html: html });
      }
      exegesisCache[chapter] = sections.length ? sections : null;
      done();
    })
    .catch(function() {
      exegesisCache[chapter] = null;
      done();
    });
}

function categoryClass(cat) {
  if (cat.indexOf('STRONG') === 0) return 'cat-strong';
  if (cat.indexOf('LEANS') === 0) return 'cat-leans';
  if (cat === 'MISAPPLIED') return 'cat-mis';
  return 'cat-na';
}

function topicsFor(chapter, verse) {
  if (!topicsLoaded || typeof TOPICS === 'undefined') return [];
  var byBook = TOPICS[currentBook];
  if (!byBook) return [];
  var rows = byBook[String(chapter)] || [];
  var hits = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var after = chapter > r.sc || (chapter === r.sc && verse >= r.sv);
    var before = chapter < r.ec || (chapter === r.ec && verse <= r.ev);
    if (after && before) hits.push(r);
  }
  return hits;
}

/* One quiet line, plus the verdicts behind it. The count is of topics that
   actually say something: most passages are NOT_APPLICABLE to most topics
   (1,376 of 1,959 OSAS rows, 1,088 of 1,976 determinism rows), so counting
   every covering row would report the same number on nearly every passage and
   tell the reader nothing. The not-applicable rows are still listed once the
   line is opened -- that a report considered the passage and found it beside
   the point is itself worth being able to check. */
function renderTopics(hits) {
  if (!hits.length) return '';
  var rows = '';
  var speaking = 0;
  ['o', 'd'].forEach(function(t) {
    var row = null;
    for (var i = 0; i < hits.length; i++) {
      if (hits[i].t === t) { row = hits[i]; break; }
    }
    if (!row) return;
    if (row.c !== 'NOT_APPLICABLE') speaking++;
    var href = 'reports/' + TOPIC_PATHS[t] + '/index.html';
    rows += '<div class="topic-row">' +
            '<span class="topic-name">' + TOPIC_NAMES[t] + '</span>' +
            '<a class="badge ' + categoryClass(row.c) + '" href="' + href + '" ' +
            'title="' + escapeAttr(row.n) + ' (' + row.r + ')">' +
            row.c.replace(/_/g, ' ') + '</a></div>';
  });
  if (!rows) return '';

  var label = speaking === 0 ? 'No topic discusses this passage'
            : speaking === 1 ? '1 topic discusses this passage'
            : speaking + ' topics discuss this passage';

  return '<div class="topics' + (topicsOpen ? ' open' : '') + '">' +
         '<button class="topic-summary" type="button" onclick="toggleTopics(this)" ' +
         'aria-expanded="' + (topicsOpen ? 'true' : 'false') + '">' +
         '<span class="topic-caret">&#9656;</span>' +
         '<span class="topic-summary-text">' + label + '</span></button>' +
         '<div class="topic-list">' + rows + '</div></div>';
}

// Open and close in place rather than re-rendering: updatePane() resets the
// pane's scroll to the top, which would throw the reader out of a long section.
function toggleTopics(btn) {
  topicsOpen = !topicsOpen;
  var box = btn.parentNode;
  box.className = 'topics' + (topicsOpen ? ' open' : '');
  btn.setAttribute('aria-expanded', topicsOpen ? 'true' : 'false');
  try { localStorage.setItem('rcb-topics-open', topicsOpen ? '1' : '0'); } catch (e) {}
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// What the reader is on: an explicit request if there is one, else the scroll.
function activeVerse() { return pinnedVerse || currentVerse(); }

function updatePane() {
  if (!paneOn) return;
  var pos = activeVerse();
  var inner = document.getElementById('paneInner');
  if (!pos) {
    inner.innerHTML = '<p class="pane-empty">Scroll the text to follow along.</p>';
    return;
  }

  var cached = exegesisCache[pos.ch];
  if (cached === undefined) {
    loadExegesis(pos.ch, function() { lastKey = null; updatePane(); });
    return;
  }
  if (cached === 'loading') return;

  // Containment only, with no nearest-section fallback. 17 of the RCB's 7,943
  // verses have no exegesis section (John 7:53-8:11, Titus 2:7-10, Revelation
  // 12:18); showing a neighbouring section there would present commentary on
  // one passage as though it covered another.
  var section = null;
  if (cached) {
    for (var i = 0; i < cached.length; i++) {
      if (pos.v >= cached[i].start && pos.v <= cached[i].end) { section = cached[i]; break; }
    }
  }

  // Re-render only when the pane's content would actually change. The exegesis
  // section and the report rows divide the chapter differently (1,966 exegesis
  // sections against 1,956 and 1,975 report rows), so both go in the key --
  // keying on the section alone would freeze the badges mid-section.
  var hits = topicsFor(pos.ch, pos.v);
  var key = pos.ch + ':' + (section ? section.start + '-' + section.end : 'v' + pos.v) +
            '|' + hits.map(function(h) { return h.t + h.r; }).join(',');
  if (key === lastKey) return;
  lastKey = key;

  var stem = EXEGESIS_BOOKS[currentBook];
  var full = stem ? 'exegesis/nt/' + stem + '_' + pad2(pos.ch) + '.html' : null;
  var html = '';

  if (section) {
    html += '<div class="pane-ref">' + bookLabel() + ' ' + pos.ch + ':' +
            section.start + (section.end !== section.start ? '-' + section.end : '') + '</div>';
    html += '<div class="pane-title">' + section.title + '</div>';
    html += renderTopics(hits);
    html += '<div class="pane-body">' + section.html + '</div>';
  } else {
    html += '<div class="pane-ref">' + bookLabel() + ' ' + pos.ch + ':' + pos.v + '</div>';
    html += renderTopics(hits);
    html += '<p class="pane-empty">The exegesis has no section covering this verse, ' +
            'so there is nothing to show rather than something approximate.</p>';
  }

  if (full) {
    html += '<div class="pane-footer"><a href="' + full + '">' +
            'Full chapter exegesis &rarr;</a></div>';
  }

  inner.innerHTML = html;
  document.getElementById('pane').scrollTop = 0;
}

function bookLabel() {
  return document.getElementById('toolbar-book').textContent || '';
}

// Put a verse on the reading line -- the same line currentVerse() measures
// against, so the verse scrolled to is the verse the pane then reports.
function scrollToVerse(ch, v) {
  var el = document.getElementById('v' + ch + '-' + v);
  if (!el) return false;
  // Land the verse a little ABOVE the reading line. Placing it exactly on the
  // line made the comparison in currentVerse() a coin toss, which reported the
  // preceding verse -- Hebrews 11:1 read as 10:39.
  var top = el.getBoundingClientRect().top + window.scrollY;
  window.scrollTo(0, Math.max(0, top - READING_LINE + 8));
  return true;
}

function toggleCommentary() {
  // Hiding the commentary widens the reading column, which reflows the text and
  // would otherwise carry the passage off screen. Note the place, then return
  // to it once the new width has been laid out.
  var anchor = activeVerse();

  paneOn = !paneOn;
  document.body.classList.toggle('show-commentary', paneOn);
  var btn = document.getElementById('commentaryBtn');
  btn.classList.toggle('active', paneOn);
  btn.setAttribute('aria-pressed', paneOn ? 'true' : 'false');
  try { localStorage.setItem('rcb-commentary', paneOn ? '1' : '0'); } catch (e) {}

  measureVerses();
  if (anchor) {
    scrollToVerse(anchor.ch, anchor.v);
    measureVerses();
  }

  if (paneOn) {
    if (!topicsLoaded) {
      var s = document.createElement('script');
      s.src = 'rcb/data/topics.js';
      s.onload = function() { topicsLoaded = true; lastKey = null; updatePane(); };
      s.onerror = function() { topicsLoaded = false; };
      document.head.appendChild(s);
    }
    lastKey = null;
    updatePane();
  }
}

var ticking = false;
window.addEventListener('scroll', function() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function() {
    ticking = false;
    // Note this runs with the pane off too. The bookmark is a property of
    // reading, not a commentary feature, and the guard used to sit above it.
    savePlace();
    if (paneOn) updatePane();
  });
}, { passive: true });

window.addEventListener('resize', function() {
  // A narrower window can leave the saved pane width wider than MIN_TEXT allows.
  var cur = parseInt(getComputedStyle(document.documentElement)
                       .getPropertyValue('--pane-w'), 10);
  if (cur) setPaneWidth(cur);
  measureVerses();
});

/* ==================== Reference picker ====================
 *
 * Books -> chapters -> verses, each step a grid of blocks. It draws from
 * data/index.js, which records what the RCB actually contains, so a verse the
 * critical text omits (Romans 16:24, Mark 11:26) is never offered.
 */

var pickerStep = 'books';
var pickerBook = null;
var pickerChapter = null;

function openPicker() {
  pickerStep = 'books';
  pickerBook = null;
  pickerChapter = null;
  document.getElementById('pickerBackdrop').classList.add('open');
  renderPicker();
}

function closePicker() {
  document.getElementById('pickerBackdrop').classList.remove('open');
}

function pickBook(code) {
  pickerBook = code;
  pickerStep = 'chapters';
  renderPicker();
}

function pickChapter(n) {
  pickerChapter = n;
  var verses = RCB_INDEX.books[pickerBook].chapters[n - 1] || [];
  // A one-verse chapter has nothing to choose; go straight there.
  if (verses.length <= 1) return goTo(pickerBook, n, verses[0] || 1);
  pickerStep = 'verses';
  renderPicker();
}

function goTo(code, chapter, verse) {
  closePicker();
  var frag = '#v' + chapter + '-' + verse;
  if (code === currentBook && scrollToVerse(chapter, verse)) {
    // Same book: no reload, just move.
    history.replaceState(null, '', location.pathname + location.search + frag);
    pinVerse(chapter, verse);
    lastKey = null;
    updatePane();
    savePlace();   // a jump inside the book may not scroll, so no scroll event
    return;
  }
  location.href = location.pathname + '?book=' + code + frag;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

/* ---- Passage entry: "rom 8:28", "1 john 2", "Rev 21 4" ---- */

function normKey(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

// Short forms a reader is likely to type that are not a prefix of the name.
var BOOK_ALIASES = {
  mt: 'MAT', mk: 'MRK', lk: 'LUK', jn: 'JHN', ac: 'ACT', rm: 'ROM',
  philem: 'PHM', phlm: 'PHM', hb: 'HEB', jm: 'JAS', rv: 'REV', apoc: 'REV',
  '1co': '1CO', '2co': '2CO', '1th': '1TH', '2th': '2TH',
  '1ti': '1TI', '2ti': '2TI', '1pt': '1PE', '2pt': '2PE',
  '1jn': '1JN', '2jn': '2JN', '3jn': '3JN'
};

// Every spelling of a book that should resolve to its code.
var BOOK_KEYS = (function () {
  var map = {};
  RCB_INDEX.order.forEach(function (code) {
    var bk = RCB_INDEX.books[code];
    [code, bk.abbrev, bk.name].forEach(function (form) {
      var k = normKey(form);
      if (k && !map[k]) map[k] = code;
    });
  });
  for (var a in BOOK_ALIASES) if (!map[a]) map[a] = BOOK_ALIASES[a];
  return map;
})();

function matchBook(text) {
  var k = normKey(text);
  if (!k) return null;
  if (BOOK_KEYS[k]) return BOOK_KEYS[k];
  // Prefix match, but only when it is unambiguous: "jo" could be John or Jonah,
  // so it resolves to nothing rather than to a guess.
  var hits = [];
  for (var key in BOOK_KEYS) {
    if (key.indexOf(k) === 0 && hits.indexOf(BOOK_KEYS[key]) === -1) {
      hits.push(BOOK_KEYS[key]);
    }
  }
  return hits.length === 1 ? hits[0] : null;
}

// -> {code, chapter, verse, error} ; chapter/verse null when not given
function parseReference(text) {
  var m = /^\s*([1-3]?\s*[A-Za-z][A-Za-z\s]*?)\s*\.?\s*(?:(\d+)\s*(?:[:.\s]\s*(\d+))?)?\s*$/.exec(text || '');
  if (!m) return { error: 'Try something like "Rom 8:28"' };

  var code = matchBook(m[1]);
  if (!code) return { error: 'No book matches "' + m[1].trim() + '"' };

  var bk = RCB_INDEX.books[code];
  if (!m[2]) return { code: code, chapter: null, verse: null };

  // In a one-chapter book a bare number is the verse -- "Jude 14" means verse
  // 14, not chapter 14. An explicit "Jude 1:14" still parses the normal way.
  if (bk.chapters.length === 1 && !m[3]) {
    var only = bk.chapters[0];
    var vv = parseInt(m[2], 10);
    if (only.indexOf(vv) === -1) {
      return { error: bk.name + ' has ' + only[only.length - 1] + ' verses' };
    }
    return { code: code, chapter: 1, verse: vv };
  }

  var ch = parseInt(m[2], 10);
  if (ch < 1 || ch > bk.chapters.length) {
    return { error: bk.name + ' has ' + bk.chapters.length + ' chapter' +
                    (bk.chapters.length === 1 ? '' : 's') };
  }

  var verses = bk.chapters[ch - 1];
  if (!m[3]) return { code: code, chapter: ch, verse: verses[0] };

  var v = parseInt(m[3], 10);
  if (verses.indexOf(v) === -1) {
    // Distinguish "out of range" from "the RCB does not carry that verse".
    var last = verses[verses.length - 1];
    var msg = v >= 1 && v <= last
      ? bk.name + ' ' + ch + ':' + v + ' is not in the critical text'
      : bk.name + ' ' + ch + ' has ' + last + ' verses';
    return { error: msg };
  }
  return { code: code, chapter: ch, verse: v };
}

function onSearchInput() {
  var box = document.getElementById('pickerSearch');
  var hint = document.getElementById('pickerHint');
  var q = box.value.trim();
  if (!q) { hint.className = 'picker-hint'; hint.textContent = ''; return; }

  var r = parseReference(q);
  if (r.error) {
    hint.className = 'picker-hint miss';
    hint.textContent = r.error;
    return;
  }
  var bk = RCB_INDEX.books[r.code];
  hint.className = 'picker-hint hit';
  hint.textContent = '→ ' + bk.name + (r.chapter ? ' ' + r.chapter : '') +
                     (r.chapter && r.verse ? ':' + r.verse : '') +
                     '   (press Enter)';
}

function onSearchKey(e) {
  if (e.key !== 'Enter') return;
  var r = parseReference(document.getElementById('pickerSearch').value);
  if (r.error) return;
  if (r.chapter) return goTo(r.code, r.chapter, r.verse);
  pickBook(r.code);   // book alone -> show its chapters
}

function renderPicker() {
  var el = document.getElementById('picker');
  var html = '<div class="picker-head"><div class="picker-crumb">';

  if (pickerStep === 'books') {
    html += 'Choose a book';
  } else {
    html += '<button onclick="openPicker()">Books</button>';
    html += '<span class="sep">&rsaquo;</span>';
    var bk = RCB_INDEX.books[pickerBook];
    if (pickerStep === 'chapters') {
      html += esc(bk.name);
    } else {
      html += '<button onclick="pickBook(\'' + pickerBook + '\')">' + esc(bk.name) + '</button>';
      html += '<span class="sep">&rsaquo;</span>' + pickerChapter;
    }
  }

  // The way to the introduction. It sits on the head row rather than above the
  // grid so it costs no height -- the picker's whole value is that every target
  // is a short mouse move from every other.
  html += '</div><div class="picker-actions">' +
          '<a class="picker-front" href="index.html?book=INTRO">Introduction</a>' +
          '<button class="picker-close" onclick="closePicker()" title="Close">&times;</button>' +
          '</div></div>';

  if (pickerStep === 'books') {
    html += '<input class="picker-search" id="pickerSearch" type="text" ' +
            'placeholder="Enter passage — e.g. Rom 8:28" autocomplete="off" ' +
            'oninput="onSearchInput()" onkeydown="onSearchKey(event)">' +
            '<div class="picker-hint" id="pickerHint"></div>';
    // One dense grid in canonical order; the genre colour does the grouping.
    html += '<div class="blocks books">';
    RCB_INDEX.order.forEach(function(code) {
      var bk = RCB_INDEX.books[code];
      var cur = code === currentBook ? ' current' : '';
      html += '<button class="block g-' + bk.genre + cur + '" onclick="pickBook(\'' +
              code + '\')" title="' + esc(bk.name) + '">' + esc(bk.abbrev) + '</button>';
    });
    html += '</div>';
  } else if (pickerStep === 'chapters') {
    var chapters = RCB_INDEX.books[pickerBook].chapters;
    html += '<div class="blocks nums">';
    for (var c = 1; c <= chapters.length; c++) {
      html += '<button class="block" onclick="pickChapter(' + c + ')">' + c + '</button>';
    }
    html += '</div>';
  } else {
    var verses = RCB_INDEX.books[pickerBook].chapters[pickerChapter - 1] || [];
    html += '<div class="blocks nums">';
    verses.forEach(function(v) {
      html += '<button class="block" onclick="goTo(\'' + pickerBook + '\',' +
              pickerChapter + ',' + v + ')">' + v + '</button>';
    });
    html += '</div>';
  }

  el.innerHTML = html;

  // Focus the box so a reference can be typed without reaching for the mouse.
  var box = document.getElementById('pickerSearch');
  if (box) box.focus();
}

document.getElementById('pickerBackdrop').addEventListener('click', function(e) {
  if (e.target === this) closePicker();
});

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('pickerBackdrop').classList.contains('open')) closePicker();
});

/* ==================== Resizable divider ==================== */

var MIN_PANE = 280, MIN_TEXT = 340;

function setPaneWidth(px) {
  var layout = document.querySelector('.layout');
  var max = layout.clientWidth - MIN_TEXT;
  px = Math.max(MIN_PANE, Math.min(px, Math.max(MIN_PANE, max)));
  document.documentElement.style.setProperty('--pane-w', px + 'px');
  return px;
}

(function initDivider() {
  var divider = document.getElementById('divider');
  var dragging = false;
  var dragAnchor = null;

  function settle() {
    measureVerses();
    if (dragAnchor) {
      scrollToVerse(dragAnchor.ch, dragAnchor.v);
      measureVerses();
    }
    lastKey = null;
    updatePane();
  }

  divider.addEventListener('mousedown', function(e) {
    dragging = true;
    // Resizing reflows the reading column just as toggling does, so hold the
    // reader's place across the drag.
    dragAnchor = activeVerse();
    divider.classList.add('dragging');
    document.body.classList.add('resizing');
    e.preventDefault();
  });

  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var layout = document.querySelector('.layout');
    // The pane is flush to the layout's right edge, so its width is whatever
    // lies between the cursor and that edge.
    setPaneWidth(layout.getBoundingClientRect().right - e.clientX - 10);
  });

  window.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.classList.remove('resizing');
    try {
      var w = getComputedStyle(document.documentElement).getPropertyValue('--pane-w');
      localStorage.setItem('rcb-pane-w', parseInt(w, 10));
    } catch (err) {}
    settle();
    dragAnchor = null;
  });

  // Double-click the divider to restore the default split.
  divider.addEventListener('dblclick', function() {
    dragAnchor = activeVerse();
    setPaneWidth(400);
    try { localStorage.setItem('rcb-pane-w', 400); } catch (err) {}
    settle();
    dragAnchor = null;
  });

  var saved = null;
  try { saved = localStorage.getItem('rcb-pane-w'); } catch (err) {}
  if (saved) setPaneWidth(parseInt(saved, 10));
})();

/* ==================== Boot ==================== */

// Keep the browser from re-applying a stale scroll position over our anchor.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

var params = new URLSearchParams(window.location.search);
var bookCode = params.get('book');
var bootHash = window.location.hash ? window.location.hash.substring(1) : '';

// Nothing asked for: return the reader to where they left off, and failing that
// open the introduction -- a Bible opens on its title page, not on Matthew 1,
// and a first-time visitor needs to be told what the brackets are before
// meeting one.
if (!bookCode) {
  var place = readPlace();
  if (place) {
    bookCode = place.book;
    if (!bootHash) bootHash = 'v' + place.ch + '-' + place.v;
  } else {
    bookCode = 'INTRO';
  }
}

/* The introduction is a page, not a book: no verses, so nothing for the
 * commentary to sync to and nothing for the bookmark to record. It rides the
 * same shell and the same loader, which is what keeps it feeling like part of
 * the Bible rather than a website page bolted to the side of one. */
if (bookCode === 'INTRO') {
  currentBook = null;
  document.body.classList.add('rcb-intro');
  var introScript = document.createElement('script');
  introScript.src = 'rcb/data/INTRO.js';
  introScript.onload = function() {
    document.getElementById('content').innerHTML = '<div class="rcb-intro-body">' + INTRO + '</div>';
    document.getElementById('toolbar-book').textContent = 'Introduction';
  };
  introScript.onerror = function() {
    document.getElementById('content').innerHTML = '<p class="error-msg">Introduction not found.</p>';
  };
  document.head.appendChild(introScript);
} else if (bookCode) {
  currentBook = bookCode;
  var script = document.createElement('script');
  script.src = 'rcb/data/' + bookCode + '.js';
  script.onload = function() {
    document.getElementById('content').innerHTML = parseUSFM(USFM);

    // Settle the layout before resolving the hash. Showing the commentary
    // narrows the reading column, and a column laid out at one width then
    // reflowed to another leaves the earlier scroll position pointing
    // somewhere else entirely -- ?book=LUK#v15-11 landed on Luke 10.
    restoreCommentary();

    // Anchor synchronously rather than inside requestAnimationFrame: rAF does
    // not fire while the tab is not visible, so a link opened in a background
    // tab never got anchored at all. measureVerses() forces layout itself, so
    // there is nothing a frame would have waited for.
    bootAnchor(bootHash);
  };

function anchorTo(hash) {
  var m = /^v(\d+)-(\d+)$/.exec(hash);
  if (m) {
    pinVerse(parseInt(m[1], 10), parseInt(m[2], 10));
    return scrollToVerse(parseInt(m[1], 10), parseInt(m[2], 10));
  }
  if (hash) {
    var el = document.getElementById(hash);
    if (el) { el.scrollIntoView(); return true; }
  }
  return false;
}

/* Anchoring once is not enough. The browser applies its own scroll position
 * while the document is still finishing, which lands on 0 and silently undoes
 * the anchor set during boot -- ?book=ROM#v8-28 opened at Romans 1:1. So take
 * scroll restoration off the browser and re-apply until the position holds
 * still, giving up the moment the reader scrolls so we never fight them. */
function bootAnchor(hash) {
  measureVerses();

  if (!hash) { lastKey = null; updatePane(); savePlace(); return; }

  var abandoned = false;
  function userTookOver() { abandoned = true; }
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function(ev) {
    window.addEventListener(ev, userTookOver, { passive: true, once: true });
  });

  var tries = 0, lastY = -1;
  (function attempt() {
    if (abandoned) return;
    measureVerses();
    anchorTo(hash);
    measureVerses();
    lastKey = null;
    updatePane();
    savePlace();

    var settled = window.scrollY === lastY;
    lastY = window.scrollY;
    if (!settled && ++tries < 8) setTimeout(attempt, 70);
  })();
}
  script.onerror = function() {
    document.getElementById('content').innerHTML = '<p class="error-msg">Book data not found.</p>';
  };
  document.head.appendChild(script);
} else {
  document.getElementById('content').innerHTML = '<p class="error-msg">No book specified.</p>';
}

// Default the pane on where there is room for it beside the text, off where it
// would cover the passage the reader arrived to read.
function restoreCommentary() {
  var saved = null;
  try { saved = localStorage.getItem('rcb-commentary'); } catch (e) {}
  var want = saved === null ? window.innerWidth > 1100 : saved === '1';
  if (want && !paneOn) toggleCommentary();
}
</script>
